<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>考研英语 · 单词与长难句</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231b2432'/%3E%3Cpath d='M11 9v14M11 12h11' stroke='%23fbfaf6' stroke-width='2'/%3E%3Cpath d='M15 18h7' stroke='%23a8401f' stroke-width='2'/%3E%3C/svg%3E">
<style>
*{box-sizing:border-box}
:root{--ink:#241a12;--muted:#8a7365;--line:rgba(126,84,46,.16);--paper:#f7f2ec;--white:#fffdfa;--accent:#d9571a;--blue:#3d6b86;--green:#4b7a56;--brown:#8a6a3c;--teal:#4a7370;--ease:cubic-bezier(.22,.9,.28,1)}
html,body{height:100%;margin:0}
body{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);height:100vh;height:100dvh;overflow:hidden;-webkit-text-size-adjust:100%;-webkit-font-smoothing:auto;background:var(--paper);color:var(--ink);font:15px/1.6 "Inter",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
/* 滚动条与站点一致：平时完全透明，指针进入可滚区域才浮现 */
*{scrollbar-width:thin;scrollbar-color:transparent transparent}
*:hover{scrollbar-color:rgba(126,84,46,.3) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:transparent;border:2px solid transparent;border-radius:10px;background-clip:content-box;transition:background-color .25s var(--ease)}
*:hover::-webkit-scrollbar-thumb{background-color:rgba(126,84,46,.26)}
*:hover::-webkit-scrollbar-thumb:hover{background-color:rgba(217,87,26,.5)}
::-webkit-scrollbar-corner{background:transparent}
.hdr{display:flex;align-items:center;gap:14px;padding:5px 14px 4px;border-bottom:1px solid var(--line);min-width:0}
.hdr h1{margin:0;font-size:15px;font-weight:600;letter-spacing:.3px;line-height:1.25;display:flex;align-items:center;gap:8px}
.hdr h1 .yr{font-size:9.5px;font-weight:500;letter-spacing:.06em;color:var(--accent-cream);background:rgba(217,87,26,.1);border:1px solid rgba(217,87,26,.22);border-radius:999px;padding:1px 7px;font-family:'JetBrains Mono',monospace;white-space:nowrap}
.hdr .sub{margin:1px 0 0;font-size:10.5px;color:var(--muted);letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 词汇图谱的分类栏 + 控制行，合成一条并进顶部栏，跟长难句的工具同一行 */
.batools{display:none;align-items:center;gap:6px;flex:1 1 auto;min-width:0;justify-content:flex-end;overflow-x:auto;scrollbar-width:none;animation:barIn .22s var(--ease) both}
.batools::-webkit-scrollbar{display:none}
.hdr.mm-mode .batools{display:flex}
.batools .mmtabs{display:flex;gap:2px;padding:2px;border-radius:8px;background:rgba(126,84,46,.07);flex:none}
.batools .mmtab{height:26px;padding:0 8px;border:0;border-radius:6px;background:none;font-family:inherit;font-size:11.5px;color:var(--muted);cursor:pointer;white-space:nowrap;max-width:7.6em;overflow:hidden;text-overflow:ellipsis;transition:background .18s,color .18s}
.batools .mmtab:hover{color:var(--ink)}
.batools .mmtab.on{background:var(--white);color:var(--ink);box-shadow:0 1px 2px rgba(30,40,54,.1)}
.batools .mmstat{font-size:11.5px;color:var(--muted);white-space:nowrap;flex:none;font-variant-numeric:tabular-nums;letter-spacing:.2px;min-width:3.4em;text-align:right}
.batools .mmprog{width:44px;height:4px;border-radius:3px;background:rgba(126,84,46,.16);overflow:hidden;flex:none}
.batools .mmprog i{display:block;height:100%;background:var(--green);width:0;transition:width .25s}
.batools .mmbtn{height:26px;padding:0 8px;border-radius:6px;border:1px solid var(--line);background:var(--white);font-family:inherit;font-size:11.5px;color:var(--text-dim);cursor:pointer;white-space:nowrap;flex:none;transition:background .18s,color .18s,border-color .18s}
.batools .mmbtn:hover{color:var(--ink);background:#f4ece1;border-color:rgba(217,87,26,.28)}
.batools .mmbtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tools{display:flex;gap:8px;align-items:center;flex:0 1 auto;min-width:0;overflow-x:auto;scrollbar-width:none;animation:barIn .22s var(--ease) both}
.tools::-webkit-scrollbar{display:none}
@keyframes barIn{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.t{border:0;background:none;padding:0 8px;height:26px;display:inline-flex;align-items:center;font:inherit;font-size:11.5px;color:var(--muted);cursor:pointer;border-bottom:1.6px solid transparent;border-radius:5px;font-family:inherit;transition:color .18s,background .18s,border-color .18s}
.t:hover{color:var(--ink);background:rgba(126,84,46,.07)}
.t.on{color:var(--ink);border-bottom-color:var(--accent);background:rgba(217,87,26,.06)}
#btnToggle{min-width:4.6em;justify-content:center}
.tabs{position:relative;display:flex;gap:2px;border:1px solid var(--line);border-radius:7px;padding:2px;flex:none;margin-left:auto;isolation:isolate}
.pill{position:absolute;top:3px;bottom:3px;left:3px;width:0;background:var(--ink);border-radius:5px;transition:left .22s cubic-bezier(.4,0,.2,1),width .22s cubic-bezier(.4,0,.2,1);z-index:0}
.tab{position:relative;z-index:1;border:0;background:none;padding:0 11px;min-height:30px;font-family:inherit;font-size:12px;color:var(--muted);cursor:pointer;border-radius:5px;transition:color .18s;white-space:nowrap;flex:none}
.tab.on{color:#fbfaf6}
.viewport{min-height:0;overflow:hidden}
@keyframes fadein{from{opacity:0;transform:translateY(6px) scale(.994)}to{opacity:1;transform:none}}
.fade{animation:fadein .26s cubic-bezier(.22,.9,.28,1) both}
.viewport>main{height:100%}
.viewport>main[hidden]{display:none}
#mm-wrap{height:100%}
#mm-wrap[hidden]{display:none}
#mmFrame{width:100%;height:100%;border:0;display:block}
.flag{margin-left:auto;border:0;background:none;font-family:inherit;font-size:15px;line-height:1;color:#c4bcab;cursor:pointer;padding:2px 4px;min-height:26px;transition:color .18s,transform .18s}
.flag:hover{transform:scale(1.12)}
.flag.on{color:var(--accent)}
.it .d{flex:none;width:5px;height:5px;border-radius:50%;background:var(--accent);align-self:center}
.nav .empty{font-size:12px;color:var(--muted);padding:6px 9px;line-height:1.6}
#btnPrev,#btnNext{min-width:34px;justify-content:center;font-size:16px;line-height:1}
#btnPrev:disabled,#btnNext:disabled{opacity:.34;cursor:default}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:9px;padding-top:7px;border-top:1px dashed var(--line);font-size:10.5px;color:var(--muted)}
.legend span{border-bottom:3px solid;padding-bottom:1px}
main{display:grid;grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);min-height:0;--navw:224px;position:relative;transition:grid-template-columns .34s var(--ease)}
.nav{overflow:auto;padding:8px 8px 16px;border-right:1px solid var(--line);min-width:0;transition:opacity .22s var(--ease),padding .3s var(--ease),border-color .3s var(--ease)}
.nav .g{font-size:11px;color:var(--muted);letter-spacing:.5px;margin:6px 0 3px;padding-left:9px}
.nav .yr{margin:1px 0}
.nav .yh{display:flex;align-items:center;gap:7px;width:100%;background:none;border:0;border-radius:6px;padding:8px 9px;cursor:pointer;font-family:inherit;color:inherit;text-align:left;min-height:34px;transition:background .16s}
.nav .yh:hover{background:#f3f1ea}
.nav .yy{font-size:13px;font-weight:700;letter-spacing:.2px;font-variant-numeric:tabular-nums}
.nav .yn{font-size:10.5px;color:var(--muted)}
.nav .yh .k{margin-left:auto;font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.nav .yh .arr{flex:none;color:#b3ac9e;transition:transform .18s}
.nav .yr.open .yh .arr{transform:rotate(90deg)}
.nav .yb{display:none;padding:1px 0 6px}
.nav .yr.open .yb{display:block;animation:navIn .22s cubic-bezier(.22,.9,.28,1) both}
@keyframes navIn{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.it{display:flex;gap:8px;width:100%;background:none;border:0;border-left:2px solid transparent;padding:6px 8px;cursor:pointer;text-align:left;font-family:inherit;color:#5f6672;font-size:12px;line-height:1.4;transition:color .16s,background .16s,border-left-color .2s,padding-left .2s}
.it:hover{color:var(--ink);background:#f7f5ee}
.it.cur{color:var(--ink);border-left-color:var(--accent)}
.it .n{flex:none;width:18px;font-size:10.5px;color:var(--muted)}
.it .tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:Georgia,"Times New Roman",serif}
.it.cur .n{color:var(--accent)}
.stage{display:flex;flex-direction:column;min-height:0;min-width:0;position:relative}
/* 年份栏：拖动改宽 + 双击复位 + 收起，沿站点右侧栏的手感 */
.navsplit{position:absolute;left:-5px;top:0;bottom:0;width:11px;z-index:6;display:none;cursor:col-resize;touch-action:none}
@media (min-width:780px){.navsplit{display:block}}
.navsplit .nsgrip{position:absolute;left:4px;top:0;bottom:0;width:3px;border-radius:3px;background:transparent;transition:background .2s var(--ease),box-shadow .2s var(--ease)}
.navsplit:hover .nsgrip,main.nav-dragging .nsgrip{background:rgba(217,87,26,.26);box-shadow:0 0 0 1px rgba(217,87,26,.1)}
main.nav-dragging{cursor:col-resize;user-select:none}
main.nav-collapsed .nav{opacity:0;padding-left:0;padding-right:0;border-right-color:transparent;pointer-events:none;overflow:hidden}
/* 窄栏（<200px）只留年份数字，免得“英语一 / 14 句”折行 */
main.nav-narrow .nav .yh .yn,main.nav-narrow .nav .yh .k{display:none}
.orig{flex:none;max-height:31vh;overflow:auto;padding:11px 20px 11px;border-bottom:1px solid var(--line);background:var(--white)}
.orig .meta{display:flex;gap:11px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-bottom:7px}
.en{font-family:Georgia,"Times New Roman",serif;font-size:18px;line-height:1.72;color:#121a24}
/* 换句：原句与解析块轻微上浮淡入，跟图谱跳转一个手感 */
@keyframes swapIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.orig.swap .meta,.orig.swap .en{animation:swapIn .3s cubic-bezier(.22,.9,.28,1) both}
.parse.swap > .layer{animation:swapIn .32s cubic-bezier(.22,.9,.28,1) both}
.parse.swap > .layer:nth-child(2){animation-delay:.04s}
.parse.swap > .layer:nth-child(3){animation-delay:.08s}
.parse.swap > .p-hint{animation:swapIn .32s cubic-bezier(.22,.9,.28,1) both;animation-delay:.1s}
.seg{border-bottom:3px solid transparent;padding-bottom:1px}
.seg .sl{color:#b9b2a4;margin-left:2px}
.seg .no{font-size:9px;color:#a8a296;margin-right:3px;vertical-align:super}
.pos-s{border-bottom-color:#1552c4;background:rgba(21,82,196,.27)}
.pos-v{border-bottom-color:#c62a12;background:rgba(198,42,18,.27)}
.pos-o{border-bottom-color:#0e7a3c;background:rgba(14,122,60,.27)}
.pos-attr{border-bottom-color:#7a2ea8;background:rgba(122,46,168,.25)}
.pos-adv{border-bottom-color:#8a6400;background:rgba(176,128,0,.26)}
.mix li.t-s .num,.mix li.t-s .rl{color:#1552c4}
.mix li.t-v .num,.mix li.t-v .rl{color:#c62a12}
.mix li.t-o .num,.mix li.t-o .rl{color:#0e7a3c}
.mix li.t-attr .num,.mix li.t-attr .rl{color:#7a2ea8}
.mix li.t-adv .num,.mix li.t-adv .rl{color:#8a6400}
.seg.hi{background:#fbe0a8}
.parse{flex:1;overflow:auto;min-height:0;padding:12px 22px 40px}
.parse>*{max-width:820px}
.en{max-width:800px}
.layer{margin-bottom:20px}
.lhead{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;margin:0 -8px 2px;padding:6px 8px;border-radius:6px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;color:var(--ink);letter-spacing:.4px;text-align:left;transition:background .18s ease}
.lhead:hover{background:rgba(126,84,46,.06)}
.lhead .c{margin-left:auto;font-weight:400;font-size:15px;color:var(--muted);line-height:1;transition:transform .28s cubic-bezier(.4,0,.2,1),color .18s}
.layer.open .lhead .c{transform:rotate(45deg);color:var(--accent)}
.lb{max-height:0;opacity:0;overflow:hidden;transition:max-height .32s cubic-bezier(.4,0,.2,1),opacity .24s ease,transform .32s cubic-bezier(.4,0,.2,1);transform:translateY(-3px)}
.layer.open .lb{max-height:1500px;opacity:1;transform:none;margin-top:5px}
/* 三块都收起时给一句提示，避免右边看着像坏了 */
.parse .p-hint{display:none;margin:2px 0 0;padding:10px 12px;border:1px dashed var(--line);border-radius:8px;font-size:12px;line-height:1.6;color:var(--muted);background:rgba(255,253,250,.6)}
.parse:not(:has(.layer.open)) .p-hint{display:block}
.mix{margin:0;padding:0;list-style:none}
.mix li{display:grid;grid-template-columns:14px minmax(0,150px) 12px minmax(0,1fr);gap:6px;align-items:baseline;padding:5px 0;cursor:pointer;font-size:13px;line-height:1.55}
.mix li .num{font-size:10.5px;color:var(--accent);padding-top:2px}
.mix li .rl{color:var(--muted);font-size:11.8px;line-height:1.5}
.mix li .ar{color:#c4bcab;text-align:center}
.mix li .rc{color:#20293a}
.mix li.hi{background:#fbeecb}
.gli{margin:9px 0 0;padding:0;list-style:none}
.gli li{padding:2px 0 2px 11px;border-left:1px solid var(--line);font-size:12.8px;line-height:1.6;color:#39424e}
.gli li b{font-weight:600;color:#121a24}
.trap{margin:8px 0 0;font-size:12.5px;line-height:1.6;color:#8d4526}
.wl{margin:0;padding:0;list-style:none}
.wl li{display:grid;grid-template-columns:minmax(0,max-content) 34px minmax(0,1fr);gap:9px;align-items:baseline;padding:3px 0;font-size:13px;line-height:1.55}
.wl li b{font-family:Georgia,serif;font-weight:600;color:#121a24;word-break:break-word}
.wl li i{font-style:normal;font-size:11px;color:var(--muted)}
.wl li span{color:#4b5460;min-width:0}
.creed{margin:0 0 16px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.creed-h{display:block;width:100%;text-align:left;background:none;border:0;padding:2px 0;cursor:pointer;font-family:inherit;font-size:12.5px;line-height:1.6;color:#4b5460}
.creed-h b{font-weight:600;color:var(--ink);margin-right:9px}
.creed.open .creed-h{color:var(--ink)}
.creed-b{display:none;margin:9px 0 0;padding:0;list-style:none}
.creed.open .creed-b{display:block}
.creed-b li{padding:3px 0 4px 11px;border-left:1px solid var(--line);font-size:12.7px;line-height:1.62;color:#39424e}
.creed-b li b{color:var(--ink);font-weight:600}
.mine{margin:8px 0 10px;font-size:12.8px;line-height:1.62;color:#3d4753}
.mine .lab{color:var(--muted);font-weight:600;margin-right:7px}
.mine b{color:#8f3a18;font-weight:600}
.zh{border-left:2px solid var(--line);padding-left:12px;font-size:14.5px;line-height:1.85;color:#22303f}
.sk{margin:0 0 11px;padding:8px 11px;background:#f6f2e6;border-radius:3px;font-size:12.9px;line-height:1.65;color:#2b3444}
.sk .lab{display:inline-block;font-size:10.5px;letter-spacing:.09em;color:#8f3a18;font-weight:600;margin-right:8px}
.sk b{font-weight:600;color:#121a24}
.segline{margin:11px 0 0;padding:0;list-style:none}
.segline li{padding:3px 0 3px 11px;border-left:1px solid var(--line);font-size:12.8px;line-height:1.65;color:#39424e}
.segline li b{font-family:Georgia,serif;font-weight:600;color:#121a24;margin-right:6px}
.segline li.t-s b{border-bottom:2px solid #1552c4}
.segline li.t-v b{border-bottom:2px solid #c62a12}
.segline li.t-o b{border-bottom:2px solid #0e7a3c}
.segline li.t-attr b{border-bottom:2px solid #7a2ea8}
.segline li.t-adv b{border-bottom:2px solid #8a6400}
.wl li em{display:block;font-style:normal;font-size:11.6px;color:#8a8172;margin-top:1px}
.foot{margin-top:22px;padding-top:10px;border-top:1px solid var(--line);font-size:11px;line-height:1.7;color:var(--muted)}
@media (min-width:780px){
  main{grid-template-columns:var(--navw) minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
  .parse{padding:12px 30px 52px 24px}
  .orig{padding:11px 26px 11px 22px}
}
@media (min-width:1280px){
  main{--navw:250px;grid-template-columns:var(--navw) minmax(0,1fr)}
  .en{font-size:19px}
  .parse{padding:20px 46px 70px 34px}
}
@media (max-width:779px){
  /* 手机顶栏分两行：品牌一行，视图切换 + 工具一行（图谱那排横向滚动） */
  .hdr{flex-wrap:wrap;gap:6px 8px;padding:8px 12px 7px}
  .brand{flex:1 1 100%;min-width:0}
  .tabs{margin-left:0}
  .tools{flex:1 1 100%;justify-content:flex-start;overflow-x:auto;scrollbar-width:none;gap:6px}
  .batools{flex:1 1 100%;justify-content:flex-start}
  main{transition:grid-template-rows .3s var(--ease)}
  main.nav-collapsed{grid-template-rows:0 minmax(0,1fr)}
  main.nav-collapsed .nav{opacity:0;padding-top:0;padding-bottom:0;border-bottom-color:transparent;pointer-events:none}
  .nav{display:flex;flex-wrap:nowrap;align-items:center;overflow-x:auto;overflow-y:hidden;border-right:0;border-bottom:1px solid var(--line);padding:8px 12px}
  .nav .yr{display:flex;flex:none;align-items:center;margin:0;margin-right:12px}
  .nav .yh{width:auto;flex:none;padding:6px 8px;min-height:32px}
  .nav .yh .k{display:none}
  .nav .yb{padding:0;gap:10px}
  .nav .yr.open .yb{display:flex}
  .nav .g{display:none}
  .it{flex:none;width:auto;max-width:46vw;border-left:0;padding:6px 2px}
  .it.cur{border-bottom:1.6px solid var(--accent);border-left:0}
  .it .n{width:14px}
  .orig{max-height:34vh;padding:13px 16px 12px}
  .en{font-size:16.5px;line-height:1.65}
  .parse{padding:14px 16px 44px}
  .mix li{grid-template-columns:14px minmax(0,1fr);grid-template-rows:auto auto;gap:0 6px;padding:6px 0}
  .mix li .rl{grid-column:2;grid-row:1;font-size:11.5px}
  .mix li .ar{display:none}
  .mix li .rc{grid-column:2;grid-row:2}
  .hdr{grid-template-columns:1fr auto;row-gap:9px;padding:10px 14px 8px;column-gap:10px}
  .hdr h1{font-size:16px}
  .brand{grid-column:1;grid-row:1}
  .tabs{grid-column:2;grid-row:1}
  .tools{grid-column:1/-1;justify-self:stretch;overflow-x:auto;flex-wrap:nowrap;gap:18px;padding:1px 0 2px}
  .tools::-webkit-scrollbar{display:none}
}
/* ===== 手机端补强：字号、点击热区、长词断行 ===== */
@media (max-width:779px){
body{overflow-x:hidden}
.hdr{padding:10px 12px 8px;gap:8px}
.hdr>*{min-width:0}
.hdr h1{font-size:17px;line-height:1.35;flex-wrap:wrap;gap:6px}
.hdr h1 .yr{font-size:10.5px;padding:2px 6px}
.hdr .sub{font-size:11.5px;line-height:1.5;white-space:normal}
.tabs{min-height:38px;padding:3px}
.tab{min-height:36px;padding:0 13px;font-size:13px}
.tools{gap:6px;padding:2px 0;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch}
.t{height:38px;padding:0 11px;font-size:12.5px;flex:none;white-space:nowrap}
#btnToggle{min-width:5.4em}
.nav .yh{min-height:40px}
.nav .yy{font-size:14px}
.it{padding:9px 8px;max-width:78vw}
.orig{max-height:none;overflow:visible;padding:12px 14px}
.orig .meta{font-size:12px;gap:9px}
.en{font-size:17px;line-height:1.72}
.parse{padding:12px 14px 52px;overflow:visible;flex:none;overflow-x:hidden}
.parse>*,.en{max-width:100%}
/* 手机只留一层滚动：句子和解析同屏往下走，不再被 32vh 的小窗子截断 */
.stage{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}

const LAYERS = [["mix","句子拆解"],["wd","重点词"],["zh","译文"]];
const state = { idx:0, mark:false, open:{mix:true}, allOpen:false, only:false, view:'lsc' };
const openMap = () => state.allOpen ? {mix:true, wd:true, zh:true} : {};
const FLAG_KEY = 'lsc.flag.v1';
function loadFlag(){
  try { return new Set(JSON.parse(localStorage.getItem(FLAG_KEY) || '[]')); } catch(e){ return new Set(); }
}
const flagSet = loadFlag();
function saveFlag(){ try { localStorage.setItem(FLAG_KEY, JSON.stringify([...flagSet])); } catch(e){} }
function vlist(){
  const all = S.map((s,i)=>({s,i}));
  return state.only ? all.filter(o=>flagSet.has(o.s.id)) : all;
}

const LEGEND = '<div class="legend"><span style="border-color:#1552c4;color:#1552c4">主语</span><span style="border-color:#c62a12;color:#c62a12">谓语</span><span style="border-color:#0e7a3c;color:#0e7a3c">宾语/表语</span><span style="border-color:#7a2ea8;color:#7a2ea8">定语</span><span style="border-color:#8a6400;color:#8a6400">状语</span></div>';
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const cur = () => S[state.idx];
const navEl = document.getElementById('nav');
const origEl = document.getElementById('origBox');
const parseEl = document.getElementById('parse');

/* 记住上次看到哪一句、哪些解析块展开、滚到哪：重开页面直接接上 */
const POS_KEY = 'lsc.pos.v1';
let posScroll = 0;
function loadPos(){
  try{
    const o = JSON.parse(localStorage.getItem(POS_KEY) || 'null');
    if(!o) return;
    if(Number.isInteger(o.idx) && o.idx >= 0 && o.idx < S.length) state.idx = o.idx;
    if(o.mark === true) state.mark = true;
    if(o.allOpen === true) state.allOpen = true;
    if(o.open && typeof o.open === 'object') state.open = o.open;
    if(o.only === true) state.only = true;
    if(typeof o.scroll === 'number' && o.scroll > 0) posScroll = o.scroll;
  }catch(e){}
}
function savePos(){
  try{
    localStorage.setItem(POS_KEY, JSON.stringify({
      idx: state.idx, mark: state.mark, allOpen: state.allOpen,
      only: state.only, open: state.open, scroll: parseEl.scrollTop
    }));
  }catch(e){}
}
let posTimer = 0;
parseEl.addEventListener('scroll', () => {
  clearTimeout(posTimer);
  posTimer = setTimeout(savePos, 260);
}, { passive: true });
window.addEventListener('beforeunload', savePos);
loadPos();

let navOpen = null;
const yrOf = p => String(p).split(' ')[0];
const examOf = p => String(p).split(' ').slice(1).join(' ') || '全部';

function renderNav(){
  const L = vlist();
  if(!L.length){
    navEl.innerHTML = '<p class="empty">还没有标记的句子。点原句右侧的 ☆ 标为没吃透。</p>';
    return;
  }
  if(!navOpen) navOpen = new Set([yrOf(cur().part)]);
  const years = [];
  L.forEach(o=>{
    const y = yrOf(o.s.part), ex = examOf(o.s.part);
    let g = years[years.length-1];
    if(!g || g.y !== y){ years.push({y, parts:[]}); g = years[years.length-1]; }
    let pp = g.parts[g.parts.length-1];
    if(!pp || pp.n !== ex){ g.parts.push({n:ex, items:[]}); pp = g.parts[g.parts.length-1]; }
    pp.items.push(o);
  });
  navEl.innerHTML = years.map(g=>{
    const open = navOpen.has(g.y);
    const total = g.parts.reduce((a,b)=>a+b.items.length,0);
    const multi = g.parts.length > 1;
    return '<div class="yr'+(open?' open':'')+'">'
      + '<button class="yh" data-y="'+esc(g.y)+'">'
      +   '<span class="yy">'+esc(g.y)+'</span>'
      +   '<span class="yn">'+esc(multi ? g.parts.map(p=>p.n).join(' · ') : g.parts[0].n)+'</span>'
      +   '<span class="k">'+total+' 句</span>'
      +   '<svg class="arr" viewBox="0 0 24 24" width="12" height="12" aria-hidden="true"><path d="M8 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2"/></svg>'
      + '</button>'
      + '<div class="yb">'
      + (function(){
          let out = '', n = 0;
          g.parts.forEach(p=>{
            if(multi) out += '<p class="g">'+esc(p.n)+'</p>';
            p.items.forEach(o=>{
              n++;
              out += '<button class="it'+(o.i===state.idx?' cur':'')+'" data-i="'+o.i+'">'
                + '<span class="n">'+String(n).padStart(2,'0')+'</span>'
                + '<span class="tx">'+esc(o.s.en)+'</span>'
                + (flagSet.has(o.s.id)?'<span class="d"></span>':'')+'</button>';
            });
          });
          return out;
        })()
      + '</div></div>';
  }).join('');
}

function renderEn(s){
  if(!state.mark) return esc(s.en);
  return s.seg.map((g,i)=>{
    const tail = g[3] || " ";
    const sl = (tail.endsWith(' ') ? '' : ' ') + '<span class="sl">|</span>';
    return '<span class="seg pos-'+g[2]+'" data-g="'+i+'"><sup class="no">'+(i+1)+'</sup>'+esc(g[0])+esc(tail)+sl+'</span>';
  }).join("");
}

function mixBody(s){
  return (s.sk ? '<p class="sk"><span class="lab">骨架</span>'+esc(s.sk).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')+'</p>' : '')
    + '<p class="mine"><span class="lab">怎么读</span>'+esc(s.m).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')+'</p>'
    + '<ul class="mix">'+s.seg.map((g,i)=>{
      const [role,cn] = g[1].split('|');
      return '<li data-g="'+i+'" class="t-'+g[2]+'"><span class="num">'+String(i+1)+'</span><span class="rl">'+esc(role)+'</span><span class="ar">→</span><span class="rc">'+esc(cn||'')+'</span></li>';
    }).join('')+'</ul>'
    + '<ul class="gli">'+s.gr.map(g=>'<li><b>'+esc(g.n)+'</b>　'+esc(g.u)+'</li>').join('')+'</ul>'
    + (s.trap ? '<p class="trap">易错　'+esc(s.trap)+'</p>' : '');
}
function wdBody(s){
  return '<ul class="wl">'+s.w.map(x=>'<li><b>'+esc(x.w)+'</b><i>'+esc(x.p||'')+'</i><span>'+esc(x.c)+'</span>'+(x.ctx?'<em>'+esc(x.ctx)+'</em>':'')+'</li>').join('')+'</ul>';
}
function zhBody(s){
  return '<p class="zh">'+esc(s.zh)+'</p>'
    + '<ul class="segline">'+s.seg.map(g=>{
      const cn = (g[1].split('|')[1]||'');
      return '<li class="t-'+g[2]+'"><b>'+esc(g[0])+'</b>'+esc(cn)+'</li>';
    }).join('')+'</ul>';
}
function body(k,s){
  if(k==="mix") return mixBody(s);
  if(k==="wd") return wdBody(s);
  if(k==="zh") return zhBody(s);
  return "";
}
function layer(k,s){
  const def = LAYERS.find(x=>x[0]===k);
  const open = !!state.open[k];
  return '<div class="layer'+(open?' open':'')+'" data-k="'+k+'">'
    + '<button class="lhead" data-k="'+k+'">'+esc(def[1])+'<span class="c">+</span></button>'
    + '<div class="lb">'+body(k,s)+'</div></div>';
}

function render(keepScroll){
  const st = keepScroll ? parseEl.scrollTop : 0;
  const s = cur();
  origEl.innerHTML = '<div class="meta"><span>'+esc(s.sec||s.part)+'</span><span>'+String(state.idx+1)+' / '+S.length+'</span><span>'+esc(s.tags.join(" · "))+'</span>'
    + '<button class="flag'+(flagSet.has(s.id)?' on':'')+'" id="flagBtn" aria-label="标为没吃透">'+(flagSet.has(s.id)?'★':'☆')+'</button></div>'
    + '<div class="en">'+renderEn(s)+'</div>'
    + (state.mark ? LEGEND : '');
  parseEl.innerHTML = LAYERS.map(l=>layer(l[0],s)).join('') + '<p class="p-hint">上面三块都收着：点「句子拆解」看成分如何切、点「重点词」看生词、点「译文」对照中文。</p>' + FOOT;
  parseEl.scrollTop = st;
  /* 换句/换页时重新播放一次上浮淡入，标记状态变化时不闪 */
  if(!render._first){
    origEl.classList.add('swap'); parseEl.classList.add('swap');
    clearTimeout(render._t);
    render._t = setTimeout(function(){ origEl.classList.remove('swap'); parseEl.classList.remove('swap'); }, 420);
  }
  render._first = false;
}
const FOOT = '';

function syncBtns(){
  document.getElementById('btnMark').classList.toggle('on', state.mark);
  document.getElementById('btnOnly').classList.toggle('on', state.only);
  const all = state.allOpen;
  const bt = document.getElementById('btnToggle');
  bt.textContent = all ? '收起解析' : '展开解析';
  bt.classList.toggle('on', all);
  const L = vlist();
  const pos = L.findIndex(o=>o.i===state.idx);
  const p1 = document.getElementById('btnPrev'), p2 = document.getElementById('btnNext');
  if(p1){ p1.disabled = pos<=0; p1.setAttribute('aria-disabled', pos<=0 ? 'true' : 'false'); }
  if(p2){ p2.disabled = (pos<0 || pos>=L.length-1); p2.setAttribute('aria-disabled', (pos<0 || pos>=L.length-1) ? 'true' : 'false'); }
}
function goRel(d){
  const L = vlist();
  if(!L.length) return;
  let pos = L.findIndex(o=>o.i===state.idx);
  if(pos < 0) pos = 0;
  const np = Math.max(0, Math.min(L.length-1, pos + d));
  go(L[np].i);
}
function go(i){
  state.idx = Math.max(0, Math.min(S.length-1, i));
  if(!navOpen) navOpen = new Set();
  if(window.innerWidth <= 779) navOpen = new Set([yrOf(cur().part)]);
  else navOpen.add(yrOf(cur().part));
  state.open = openMap();
  renderNav(); render(); syncBtns(); savePos();
}
function highlight(g){
  origEl.querySelectorAll('.seg.hi').forEach(x=>x.classList.remove('hi'));
  parseEl.querySelectorAll('.mix li.hi').forEach(x=>x.classList.remove('hi'));
  const seg = origEl.querySelector('.seg[data-g="'+g+'"]');
  if(seg) seg.classList.add('hi');
  const ml = parseEl.querySelector('.layer[data-k="mix"]');
  if(ml && !ml.classList.contains('open')){
    ml.classList.add('open'); state.open.mix = true;
    ml.querySelector('.lhead .c').textContent = '–';
  }
  const li = parseEl.querySelector('.mix li[data-g="'+g+'"]');
  if(li){
    li.classList.add('hi');
    const sc = (getComputedStyle(parseEl).overflowY === 'visible') ? (parseEl.closest('.stage') || parseEl) : parseEl;
const off = li.getBoundingClientRect().top - sc.getBoundingClientRect().top;
    /* 和图谱跳转同一手感：缓动滚到目标块，而不是硬跳 */
    if(off < 0 || off > sc.clientHeight - 40){
      sc.scrollTo({ top: sc.scrollTop + off - 40, behavior: 'smooth' });
    }
  }
}

document.getElementById('cnt').textContent = S.length;
movePill();
render._first = true;
renderNav(); render(); syncBtns();
if(posScroll){ parseEl.scrollTop = posScroll; }

navEl.addEventListener('click', e=>{
  const yh = e.target.closest('.yh');
  if(yh){
    const y = yh.dataset.y;
    const narrow = window.innerWidth <= 779;
    const st = navEl.scrollTop;
    if(navOpen.has(y)) navOpen.delete(y);
    else { if(narrow) navOpen.clear(); navOpen.add(y); }
    renderNav();
    navEl.scrollTop = st;
    if(narrow){
      const op = navEl.querySelector('.yr.open');
      navEl.scrollLeft = op ? Math.max(0, op.offsetLeft - 10) : 0;
    }
    return;
  }
  const b = e.target.closest('.it'); if(!b) return;
  go(Number(b.dataset.i));
});
parseEl.addEventListener('click', e=>{
  const lh = e.target.closest('.lhead');
  if(lh){
    const k = lh.dataset.k;
    state.open[k] = !state.open[k];
    const lay = lh.parentNode;
    lay.classList.toggle('open', state.open[k]);
    lh.querySelector('.c').textContent = state.open[k] ? '–' : '+';
    savePos();
    return;
  }
  const li = e.target.closest('.mix li');
  if(li) highlight(Number(li.dataset.g));
});
origEl.addEventListener('click', e=>{
  const seg = e.target.closest('.seg');
  if(seg && state.mark) highlight(Number(seg.dataset.g));
});
document.getElementById('btnMark').onclick = ()=>{ state.mark=!state.mark; render(true); syncBtns(); savePos(); };
document.getElementById('btnToggle').onclick = ()=>{
  state.allOpen = !state.allOpen;
  state.open = openMap();
  render(true); syncBtns(); savePos();
};
document.getElementById('btnRand').onclick = ()=>{ const L=vlist(); if(L.length) go(L[Math.floor(Math.random()*L.length)].i); };
document.getElementById('btnPrev').onclick = ()=>goRel(-1);
document.getElementById('btnNext').onclick = ()=>goRel(1);
document.getElementById('btnOnly').onclick = ()=>{
  state.only = !state.only;
  const L = vlist();
  if(L.length && L.findIndex(o=>o.i===state.idx) < 0){ go(L[0].i); }
  else { renderNav(); render(true); syncBtns(); savePos(); }
};
origEl.addEventListener('click', e=>{
  const fb = e.target.closest('#flagBtn');
  if(!fb) return;
  const id = cur().id;
  if(flagSet.has(id)) flagSet.delete(id); else flagSet.add(id);
  saveFlag(); render(true); renderNav(); syncBtns();
});
function ensureFrame(){
  const f = document.getElementById('mmFrame');
  if(f.dataset.ready) return;
  // 图谱是独立文件，切到该视图才加载（首屏只解析精读页本身）
  f.src = '../embed/vocab-graph.html';
  f.dataset.ready = '1';
}
function movePill(){
  const on = document.querySelector('.tab.on');
  const pill = document.getElementById('pill');
  if(!on || !pill) return;
  pill.style.left = (on.offsetLeft) + 'px';
  pill.style.width = (on.offsetWidth) + 'px';
}
function fadeIn(el){
  if(!el) return;
  el.classList.remove('fade');
  void el.offsetWidth;
  el.classList.add('fade');
}
const VIEW_KEY = 'lsc.view.v1';
/* ---- 词汇图谱：它自己的两行（分类栏 + 控制行）收进顶部栏，成一条 ----
   原控件仍在图谱 iframe 里，只是隐藏；顶部栏这排按钮点一下就把点击代理回原控件 */
const mmSlot = document.getElementById('mmBarSlot');
const MM_ACTIONS = [
  ['randomBtn','随机'],['undoneBtn','未掌握'],['doneBtn','已掌握'],['unkBtn','生词本'],
  ['findBtn','找词'],['expand','展开'],['collapse','收起'],['fit','复位']
];
const MM_TIPS = {randomBtn:'随机跳一个词', undoneBtn:'只看未掌握', doneBtn:'只看已掌握',
  unkBtn:'生词本（长按单词可加入）', findBtn:'搜索单词或释义', expand:'展开全部', collapse:'收起全部', fit:'视图复位'};
let mmTimer = 0;
const mmDoc = () => { const f = document.getElementById('mmFrame'); return f ? f.contentDocument : null; };

function buildMmBar(){
  const d = mmDoc();
  if(!d) return false;
  const tabsEl = d.getElementById('tabs');
  if(!tabsEl || !tabsEl.children.length) return false;
  const hd = d.querySelector('header');
  if(hd){
    hd.style.padding = '0';
    hd.style.border = '0';
    hd.style.background = 'transparent';
    hd.style.boxShadow = 'none';
  }
  tabsEl.style.display = 'none';
  const barEl = d.querySelector('.bar');
  if(barEl) barEl.style.display = 'none';
  const findBar = d.getElementById('findBar');
  if(findBar) findBar.style.marginTop = '0';
  if(mmSlot.dataset.built === '1'){ syncMmBar(); return true; }

  // 第四个分类名自带“· 6311 词”，一行放不下，去掉后半段（词数在别处能看到）
  const cats = [...tabsEl.children].map(b => b.textContent.trim().replace(/·\s*\d+\s*词$/, '').trim());
  mmSlot.innerHTML =
    '<div class="mmtabs">' + cats.map((n,i) =>
      '<button type="button" class="mmtab'+(i===0?' on':'')+'" data-cat="'+i+'">'+esc(n)+'</button>').join('') + '</div>'
    + '<span class="mmstat" id="mmStat">0 / 0</span>'
    + '<div class="mmprog"><i id="mmProg"></i></div>'
    + MM_ACTIONS.map(a => '<button type="button" class="mmbtn" data-btn="'+a[0]+'" title="'+(MM_TIPS[a[0]]||a[1])+'">'+a[1]+'</button>').join('');
  mmSlot.dataset.built = '1';
  syncMmBar();
  return true;
}

function syncMmBar(){
  const d = mmDoc();
  if(!d || mmSlot.dataset.built !== '1') return;
  const tabsEl = d.getElementById('tabs');
  const onIdx = tabsEl ? [...tabsEl.children].findIndex(t => t.classList.contains('on')) : 0;
  mmSlot.querySelectorAll('.mmtab').forEach((b,i)=>b.classList.toggle('on', i === onIdx));
  const stat = d.getElementById('stat');
  if(stat) mmSlot.querySelector('#mmStat').textContent =
    stat.textContent.replace('已掌握','').replace('词','').replace(/\s+/g,' ').trim();
  const pb = d.getElementById('pbar');
  if(pb) mmSlot.querySelector('#mmProg').style.width = pb.style.width || '0%';
  MM_ACTIONS.forEach(a=>{
    const src = d.getElementById(a[0]);
    const btn = mmSlot.querySelector('[data-btn="'+a[0]+'"]');
    if(src && btn) btn.classList.toggle('on', src.classList.contains('on'));
  });
}

mmSlot.addEventListener('click', e=>{
  const cat = e.target.closest('.mmtab');
  const act = e.target.closest('.mmbtn');
  const d = mmDoc();
  if(!d) return;
  if(cat){
    const t = d.getElementById('tabs').children[Number(cat.dataset.cat)];
    if(t) t.click();
  } else if(act){
    const src = d.getElementById(act.dataset.btn);
    if(src) src.click();
  } else return;
  setTimeout(syncMmBar, 80);
});

function mmFit(){
  const f = document.getElementById('mmFrame');
  const w = f && f.contentWindow;
  if(w && typeof w.fit === 'function'){ try{ w.fit(); }catch(e){} }
}

function mountMmBar(){
  document.querySelector('.hdr').classList.add('mm-mode');
  const ok = buildMmBar();
  clearInterval(mmTimer);
  mmTimer = setInterval(syncMmBar, 800);
  setTimeout(mmFit, 80);
  if(!ok){
    const f = document.getElementById('mmFrame');
    f.addEventListener('load', function once(){
      f.removeEventListener('load', once);
      if(state.view === 'mm'){ buildMmBar(); syncMmBar(); mmFit(); }
    });
  }
}
function mmCloseFind(){
  const d = mmDoc();
  const fb = d && d.getElementById('findBar');
  if(fb) fb.classList.remove('on');
}
function unmountMmBar(){
  document.querySelector('.hdr').classList.remove('mm-mode');
  clearInterval(mmTimer);
  mmTimer = 0;
  mmCloseFind();
  setTimeout(mmFit, 80);
}
window.addEventListener('resize', () => { if(state.view === 'mm') mmFit(); });

function applyView(v, save){
  state.view = v;
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on', x.dataset.v===v));
  movePill();
  const lsc = document.getElementById('main-lsc');
  const mm = document.getElementById('mm-wrap');
  lsc.hidden = (v !== 'lsc');
  mm.hidden = (v !== 'mm');
  document.getElementById('tools').style.display = (v === 'lsc') ? 'flex' : 'none';
  fadeIn(v === 'lsc' ? lsc : mm);
  const subTip = document.getElementById('subTip');
  if(subTip) subTip.textContent = (v === 'mm') ? '滚轮缩放' : '← → 换句';
  if(v === 'mm'){ ensureFrame(); mountMmBar(); } else { unmountMmBar(); }
  if(save){ try{ localStorage.setItem(VIEW_KEY, v); }catch(e){} }
}
document.querySelectorAll('.tab').forEach(tb=>{
  tb.onclick = ()=>{
    const v = tb.dataset.v;
    if(state.view === v) return;
    applyView(v, true);
  };
});window.addEventListener('resize', movePill);
try{
  const v = localStorage.getItem(VIEW_KEY);
  if(v === 'mm' || v === 'lsc') applyView(v, false);
}catch(e){}
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && state.view==='mm'){ mmCloseFind(); }
  if(state.view !== 'lsc') return;
  if(e.key==='ArrowDown'||e.key==='ArrowRight'){ goRel(1); e.preventDefault(); }
  if(e.key==='ArrowUp'||e.key==='ArrowLeft'){ goRel(-1); e.preventDefault(); }
});

/* ---------- 年份栏：拖动改宽 / 双击复位 / 拖到最窄即完全收起（对齐站点的栏体手感） ---------- */
(function(){
  const mainEl = document.getElementById('main-lsc');
  const splitEl = document.getElementById('navSplit');
  const togEl = document.getElementById('btnNav');
  if(!mainEl || !splitEl || !togEl) return;
  const wide = () => window.matchMedia('(min-width:780px)').matches;
  const defW = () => (window.innerWidth >= 1280 ? 250 : 224);
  const capW = (w) => Math.min(w, Math.round(window.innerWidth * 0.46));
  let lastW = defW(), curW = defW(), collapsed = false, drag = null;
  const setTog = (isCollapsed) => {
    togEl.classList.toggle('on', isCollapsed);
    togEl.setAttribute('aria-pressed', isCollapsed ? 'true' : 'false');
    togEl.title = isCollapsed ? '展开年份栏' : '收起年份栏';
  };
  function applyW(w){
    const snapped = w < 70 ? 0 : Math.max(150, capW(w));
    curW = snapped;
    if(snapped > 0) lastW = snapped;
    collapsed = snapped === 0;
    mainEl.classList.toggle('nav-collapsed', collapsed);
    mainEl.classList.toggle('nav-narrow', snapped > 0 && snapped < 200);
    mainEl.style.setProperty('--navw', snapped + 'px');
    setTog(collapsed);
  }
  splitEl.addEventListener('pointerdown', function(e){
    if(!wide()) return;
    e.preventDefault();
    drag = { x: e.clientX, w: curW, moved: 0 };
    mainEl.classList.add('nav-dragging');
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp, { once: true });
    window.addEventListener('pointercancel', onUp, { once: true });
  });
  function onMove(e){
    if(!drag) return;
    const dx = e.clientX - drag.x;
    drag.moved = Math.max(drag.moved, Math.abs(dx));
    if(drag.moved < 3) return;
    applyW(drag.w + dx);
  }
  function onUp(){
    window.removeEventListener('pointermove', onMove);
    mainEl.classList.remove('nav-dragging');
    drag = null;
  }
  splitEl.addEventListener('dblclick', function(){
    if(collapsed) return;
    applyW(defW());
  });
  togEl.addEventListener('click', function(e){
    e.stopPropagation();
    if(!wide()){
      /* 手机上年份栏是横排一行，收起=整行收起 */
      collapsed = !collapsed;
      mainEl.classList.toggle('nav-collapsed', collapsed);
      setTog(collapsed);
      return;
    }
    applyW(collapsed ? lastW : 0);
  });
  let wasWide = wide();
  window.addEventListener('resize', function(){
    const nowWide = wide();
    if(nowWide !== wasWide){
      wasWide = nowWide;
      if(nowWide) applyW(curW || lastW);
    }
    if(nowWide && curW > window.innerWidth * 0.46) applyW(curW);
  });
})();
</script>
