<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>设计灵感 · 参考站</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23f7f2ec'/%3E%3Cpath d='M9 23l6-14 2 9 6-5' stroke='%23d9571a' stroke-width='2.2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --ink:#1c1917;--muted:#8a7f74;--line:#e7ddcf;--white:#fffdf9;--paper:#f7f2ec;
  --accent:#d9571a;--accent-soft:#f0a578;--ease:cubic-bezier(.22,.9,.28,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--paper);color:var(--ink);
font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
-webkit-font-smoothing:antialiased}
header{flex:none;padding:10px 14px 11px;background:linear-gradient(180deg,#fffdf9,#fbf7f0);border-bottom:1px solid var(--line);
display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand h1{font-size:15px;font-weight:700;letter-spacing:.2px}
.brand p{font-size:11px;color:var(--muted);margin-top:3px}
.tabs{display:flex;gap:5px;background:#efe9dd;border-radius:12px;padding:4px;margin-left:auto}
.htools{display:flex;gap:6px;flex:none}
.tab{height:32px;padding:0 12px;border:0;border-radius:9px;background:transparent;color:#6f665c;font-family:inherit;
font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .18s,color .18s,transform .18s}
.tab.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(30,40,54,.12)}
.tab:active{transform:scale(.97)}
.tool{height:30px;padding:0 11px;border:1px solid var(--line);border-radius:9px;background:var(--white);color:#5f574e;
font-family:inherit;font-size:12px;cursor:pointer;white-space:nowrap;transition:background .16s,color .16s,transform .12s,box-shadow .16s}
.tool:hover{color:var(--accent);border-color:rgba(217,87,26,.34);box-shadow:0 6px 16px -12px rgba(85,53,28,.5)}
.tool:active{transform:scale(.97)}
main{flex:1;position:relative;min-height:0}
.pane{position:absolute;inset:0;display:none;flex-direction:column;padding:10px 12px 12px}
.pane.on{display:flex;animation:paneIn .24s var(--ease) both}
@keyframes paneIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.pane-bar{flex:none;display:flex;align-items:center;gap:9px;padding:0 4px 8px;font-size:11.5px;color:var(--muted);min-height:26px}
.pane-bar b{color:var(--ink);font-size:12.5px}
.pane-bar .dot{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.pane-bar .host{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:10.5px}
.pane-bar .open{margin-left:auto}
.frame-wrap{position:relative;flex:1;min-height:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--white);
box-shadow:0 18px 40px -34px rgba(85,53,28,.6)}
iframe{width:100%;height:100%;border:0;display:block;background:#fff}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;color:var(--muted);
background:linear-gradient(180deg,#fffdf9,#f9f4ec);transition:opacity .3s ease;pointer-events:none}
.loading i{width:14px;height:14px;border:2px solid #eadfcf;border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(1turn)}}
.loading.gone{opacity:0}
/* 明确禁止嵌入的站：给一张说明卡，直接新窗口打开 */
.blocked{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
border:1px dashed rgba(217,87,26,.28);border-radius:14px;background:rgba(255,253,249,.7);padding:26px;text-align:center;overflow:auto}
.blocked h2{font-size:17px}
.blocked p{font-size:12.5px;line-height:1.8;color:var(--muted);max-width:440px}
.blocked .warn{font-size:11px;line-height:1.7;color:#9a7654}
.blocked .warn b{color:#b45309}
.copy{border:0;background:none;padding:0 2px;font-family:inherit;font-size:11px;color:var(--accent);cursor:pointer;
border-bottom:1px solid rgba(217,87,26,.4);line-height:1.4;transition:color .16s,border-color .16s}
.copy:hover{color:#a8420f;border-color:#a8420f}
.copy.done{color:#3d7a5f;border-color:#3d7a5f}
.blocked .go{height:36px;padding:0 16px;border:0;border-radius:10px;background:var(--ink);color:#fffdf9;font-family:inherit;
font-size:12.5px;cursor:pointer;transition:transform .16s,background .16s}
.blocked .go:hover{background:#000;transform:translateY(-1px)}
/* 第三方截图：站点不让嵌时至少能看到首页长什么样 */
.shot{position:relative;width:min(660px,100%);margin-top:2px;border:1px solid var(--line);border-radius:12px;overflow:hidden;
background:#fff;box-shadow:0 18px 40px -32px rgba(85,53,28,.6)}
.shot img{display:block;width:100%;height:auto}
.shot span{position:absolute;left:8px;bottom:8px;padding:3px 8px;border-radius:6px;background:rgba(28,25,23,.78);color:#fff;
font-size:10px;letter-spacing:.2px}
.ghost{font-size:11px;color:var(--muted)}
.hint{margin-top:8px;font-size:11px;color:var(--muted);text-align:center}
@media (max-width:779px){
  header{gap:8px;padding:9px 10px 10px}
  .brand h1{font-size:14px}
  .tabs{order:3;width:100%;margin-left:0}
  .tab{flex:1;padding:0 6px}
  .htools{order:2;margin-left:auto}
  .pane{padding:8px}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>设计灵感 · 参考站</h1>
    <p>看组件、布局、动效，选中就复制回 custom-pages/</p>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="htools">
    <button class="tool" id="reload" type="button" title="重新载入当前站">刷新</button>
    <button class="tool" id="openAll" type="button" title="在新窗口打开当前站">新窗口打开</button>
  </div>
</header>
<main id="main"></main>
<p class="hint">有的站禁止被嵌进 iframe，会显示说明卡；点「新窗口打开」照样能看。</p>
<script>
const SITES = [
  { id:'21st', name:'21st.dev', url:'https://21st.dev', host:'21st.dev · 现成组件 / 模板', embed:true,
    note:'AI 生成的前端组件市场，React / Tailwind 为主，看中复制结构再改。' },
  { id:'variant', name:'Variant', url:'https://variant.com', host:'variant.com · 界面与设计参考', embed:true,
    note:'界面细节与产品视觉的参考站，适合挑排版、留白和动效节奏。' },
  { id:'awwwards', name:'Awwwards', url:'https://www.awwwards.com', host:'awwwards.com · 获奖站点', embed:false,
    note:'该站返回 X-Frame-Options: DENY，不能嵌入，直接新窗口打开看获奖案例。' },
];

const tabsEl = document.getElementById('tabs');
const mainEl = document.getElementById('main');
let cur = 0;

SITES.forEach((s, i) => {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'tab' + (i === 0 ? ' on' : '');
  b.textContent = s.name;
  b.dataset.i = i;
  b.addEventListener('click', () => switchTo(i));
  tabsEl.appendChild(b);

  const pane = document.createElement('section');
  pane.className = 'pane' + (i === 0 ? ' on' : '');
  pane.dataset.i = i;

  const bar = document.createElement('div');
  bar.className = 'pane-bar';
  bar.innerHTML = '<span class="dot"></span><b>' + s.name + '</b><span class="host">' + s.host + '</span>' +
    '<button class="tool open" type="button" data-open="' + s.url + '">打开原站</button>';
  pane.appendChild(bar);

  if (s.embed) {
    const wrap = document.createElement('div');
    wrap.className = 'frame-wrap';
    const loading = document.createElement('div');
    loading.className = 'loading';
    loading.innerHTML = '<i></i>正在打开 ' + s.name + '…';
    const f = document.createElement('iframe');
    f.dataset.src = s.url;
    f.title = s.name;
    f.setAttribute('loading', 'lazy');
    f.referrerPolicy = 'no-referrer';
    f.addEventListener('load', () => { loading.classList.add('gone'); setTimeout(() => loading.remove(), 500); });
    wrap.appendChild(f);
    wrap.appendChild(loading);
    pane.appendChild(wrap);
  } else {
    const block = document.createElement('div');
    block.className = 'blocked';
    block.innerHTML = '<h2>' + s.name + ' 不允许被嵌入</h2><p>' + s.note + '</p>' +
      '<button class="go" type="button" data-open="' + s.url + '">在新窗口打开 ' + s.name + '</button>' +
      '<p class="warn">若新窗口只显示 <b>Forbidden</b>，是该站风控挡了这个浏览器，换 Chrome / Edge 或稍后再试，也可以 <button class="copy" type="button" data-copy="' + s.url + '">复制链接</button> 去别的浏览器粘贴。</p>' +
      '<div class="shot"><img alt="' + s.name + ' 首页预览" loading="lazy" referrerpolicy="no-referrer" ' +
      'src="https://s0.wp.com/mshots/v1/' + encodeURIComponent(s.url) + '?w=1200" ' +
      'onerror="this.closest(\'.shot\').remove()"><span>第三方截图预览 · 仅看首页</span></div>';
    pane.appendChild(block);
  }
  mainEl.appendChild(pane);
});

function ensureFrame(pane) {
  const f = pane.querySelector('iframe[data-src]');
  if (f && !f.src) f.src = f.dataset.src;
}

function switchTo(i) {
  cur = i;
  tabsEl.querySelectorAll('.tab').forEach((b) => b.classList.toggle('on', +b.dataset.i === i));
  mainEl.querySelectorAll('.pane').forEach((p) => {
    const on = +p.dataset.i === i;
    p.classList.toggle('on', on);
    if (on) ensureFrame(p);
  });
}

document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-open]');
  if (b) window.open(b.dataset.open, '_blank', 'noopener,noreferrer');
  const c = e.target.closest('[data-copy]');
  if (c) {
    const url = c.dataset.copy;
    const done = () => { c.classList.add('done'); c.textContent = '已复制'; setTimeout(() => { c.classList.remove('done'); c.textContent = '复制链接'; }, 1600); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(done, () => prompt('复制这个链接：', url));
    } else prompt('复制这个链接：', url);
  }
});

document.getElementById('reload').addEventListener('click', () => {
  const pane = mainEl.querySelector('.pane[data-i="' + cur + '"]');
  const f = pane.querySelector('iframe[data-src]');
  if (!f) { switchTo(cur); return; }
  const src = f.dataset.src;
  f.src = 'about:blank';
  setTimeout(() => { f.src = src; }, 60);
});
document.getElementById('openAll').addEventListener('click', () => {
  window.open(SITES[cur].url, '_blank', 'noopener,noreferrer');
});

switchTo(0);
</script>
</body>
</html>
