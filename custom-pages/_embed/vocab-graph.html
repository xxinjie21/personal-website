<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>考研英语词汇图谱</title>

<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="考研词汇">

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{position:fixed;inset:0;background:#f4f1e9;color:#1e2836;display:flex;flex-direction:column;
font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
-webkit-text-size-adjust:100%;}
header{flex:0 0 auto;background:linear-gradient(#fffdf8,#fdfbf5);border-bottom:1px solid #e6dfd0;padding:9px 12px 10px;z-index:3;
box-shadow:0 1px 3px rgba(30,40,54,.04)}
.tabs{display:flex;gap:5px;background:#eee9dd;border-radius:12px;padding:4px}
.tab{flex:1;min-width:0;height:36px;border:0;border-radius:9px;background:transparent;color:#6a7280;font-size:13.5px;
font-weight:600;font-family:inherit;cursor:pointer;white-space:nowrap;overflow:hidden;transition:background .18s,color .18s}
.tab.on{background:#fff;color:#1e2836;box-shadow:0 1px 3px rgba(30,40,54,.12)}
.bar{display:flex;gap:7px;margin-top:9px;align-items:center}
.stat{font-size:12px;color:#8a8f98;margin-right:auto;white-space:nowrap;letter-spacing:.2px}
.progress{width:74px;height:5px;border-radius:3px;background:#e8e2d4;overflow:hidden;flex:0 0 auto}
.progress i{display:block;height:100%;background:#5b8a63;width:0;transition:width .25s}
.mini{height:30px;padding:0 10px;font-size:12.5px;border-radius:8px;border:1px solid #e3dccb;background:#fffdf8;
color:#525a66;font-family:inherit;cursor:pointer;white-space:nowrap;transition:background .16s,color .16s,transform .12s}
.mini:active{background:#efe9db;transform:scale(.97)}
#viewport{flex:1;position:relative;overflow:hidden;touch-action:none;cursor:grab;min-height:0}
#canvas{position:absolute;left:0;top:0;transform-origin:0 0;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
#canvas.moving{will-change:transform}
#canvas svg{shape-rendering:geometricPrecision}
#viewport{background-image:radial-gradient(rgba(30,40,54,.05) 1px,transparent 1.2px);background-size:22px 22px}
#viewport.grabbing{cursor:grabbing}
#viewport.grabbing .node{cursor:grabbing}
.node.k-word:hover,.node.k-cat:hover,.node.k-seg:hover{box-shadow:0 10px 22px -10px rgba(30,40,54,.3);transform:translateY(-1px);background:#fffdf8}
.node.k-group:hover,.node.k-topic:hover{border-color:#d9cfbb;box-shadow:0 10px 24px -12px rgba(30,40,54,.32)}
.node.lv0:hover{box-shadow:0 12px 30px -10px rgba(30,40,54,.45)}
.node.trace{box-shadow:0 0 0 2px rgba(217,87,26,.28),0 8px 18px -10px rgba(30,40,54,.3)}
.node.trace .w{color:#a8552f}
.node.k-word:hover .w{color:#a8552f}
.node.lpress{background:#fff6df!important;box-shadow:0 0 0 2px #e8c98a!important}
.node{position:absolute;display:flex;align-items:center;gap:7px;background:#fff;overflow:visible;cursor:pointer;
font-family:inherit;transition:box-shadow .16s,background .16s,transform .16s}
/* 布局位移：渲染后用 FLIP 从旧位置滑到新位置 */
.node.anim{transition:transform .46s cubic-bezier(.22,.61,.36,1),box-shadow .16s,background .16s}
.node.enter{animation:nodeIn .34s cubic-bezier(.22,.61,.36,1) both}
@keyframes nodeIn{from{opacity:.35;transform:scale(.94)}to{opacity:1;transform:none}}
.node.lv0{background:#1e2836;color:#f8f5ee;border-radius:18px;justify-content:center;font-weight:700;
box-shadow:0 6px 18px rgba(30,40,54,.22);letter-spacing:.6px}
.node.lv1{background:#fff;border:1px solid #e7e0d1;border-left:4px solid #a8552f;border-radius:9px;font-weight:600;color:#2b3340;
box-shadow:0 1px 2px rgba(30,40,54,.05)}
.node.lv2{background:#fff;border:1px solid #eae3d4;border-radius:9px;box-shadow:0 1px 2px rgba(30,40,54,.04)}
.node.lv3{background:#fbf8f1;border:1px solid #efe7d7;border-radius:14px;cursor:default}
.node.k-group{background:#fff;border:1px solid #e7e0d1;border-left:4px solid;border-radius:9px;font-weight:600;color:#2b3340;
box-shadow:0 1px 2px rgba(30,40,54,.05)}
.node.k-topic{background:#fff;border:1px solid #dde3ec;border-left:4px solid;border-radius:10px;color:#233043;font-weight:700;
box-shadow:0 1px 3px rgba(30,40,54,.06)}
.node.k-cat{background:#fff;border:1px solid #e7e0d1;border-radius:8px;color:#3b4351;box-shadow:0 1px 2px rgba(30,40,54,.03)}
.node.k-seg{background:#f7f4ec;border:1px solid #ece4d4;border-radius:8px;color:#6b7280}
.node.k-word{background:#fff;border:1px solid #eae3d4;border-radius:8px;color:#2b3340;box-shadow:0 1px 2px rgba(30,40,54,.04)}
.node.k-dv{background:#fbf8f1;border:1px solid #efe7d7;border-radius:14px;cursor:default}
.node.k-dv.hot{background:#eef3fc;border-color:#cddbf2}
.node.k-dv.hot .dv{color:#1f4a86;font-weight:700}
.node.k-dv:not(.hot) .dv{color:#7d848f;font-weight:500}
.node.k-dv.hot .dvpo{background:#dde7f7;color:#3e5c8c}
.node .lab{font-weight:600;white-space:nowrap}
.node.left{justify-content:flex-end;text-align:right}
.node.left.k-group,.node.left.k-topic{border-left-width:1px;border-left-color:#e7e0d1;border-right:4px solid}
.node.left .sym{order:-1}
.node .n{line-height:1.35;white-space:nowrap}
.node .w{font-weight:600;flex:0 0 auto;font-size:17px;letter-spacing:.15px;white-space:nowrap;color:#222c3a}
.node .m{font-size:13px;color:#828b99;white-space:nowrap}
.node .po{font-size:11px;color:#96794f;margin-left:6px;white-space:nowrap;flex:0 0 auto;background:#f7f1e4;border-radius:4px;padding:1px 4px;letter-spacing:0}
.node .ph{font-size:11px;color:#8b93a1;margin-left:6px;white-space:nowrap;flex:0 0 auto;font-family:"Lucida Sans Unicode","Segoe UI",-apple-system,"Noto Sans",sans-serif;letter-spacing:0}
.node .arrow{color:#c2b9a6;font-size:12px;flex:0 0 auto}
.node .dv{font-size:14px;font-weight:600;color:#49525f;white-space:nowrap}
.node .dm{font-size:12.5px;color:#8b919b;white-space:nowrap}
.node .sym{font-size:12.5px;color:#b0a897;width:14px;text-align:center;line-height:1;flex:0 0 auto}
.node.lv0 .sym{display:none}
.node.done{background:#eff5ee;border-color:#bfd2be}
.node.done .w{color:#8fa192}
.node.done .m{color:#9fada1}
.node.done .po{color:#a3ab9c;background:#f2f4ee}
.node.k-dv .dvpo{font-size:10.5px;margin-left:5px;padding:0 3px;background:#f7f1e4;color:#96794f}
.node.done .ph{color:#a7b3a8}
.node.unk .po{color:#b4795a;background:#fbead8}
.node.unk .ph{color:#b08968}
.node.done .sym{color:#5b8a63;font-weight:700}
.hi{background:#1e2836!important;color:#fff!important;border-color:#1e2836!important}
.node.hi .w,.node.hi .m,.node.hi .dv,.node.hi .dm,.node.hi .n,.node.hi .lab{color:#fff!important}


.node.unk{background:#fdeedc;border-color:#e8b184;box-shadow:0 1px 2px rgba(180,83,9,.18)}
.node.unk .w{color:#9a3412}
.node.unk .m{color:#b08968}
.node.unk .sym{color:#b45309;font-weight:700}
.mini{min-height:36px;font-size:13px;touch-action:manipulation}
.mini.on{background:#1e2836!important;color:#fff!important;border-color:#1e2836!important}
.mini:focus-visible{outline:2px solid #a8552f;outline-offset:1px}
.bar{overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.bar::-webkit-scrollbar{display:none}
#toast{position:absolute;left:50%;bottom:24px;transform:translate(-50%,8px);background:rgba(30,40,54,.92);color:#fff;
padding:9px 15px;border-radius:10px;font-size:13px;z-index:9;opacity:0;transition:opacity .18s,transform .24s cubic-bezier(.22,.61,.36,1);white-space:nowrap;
pointer-events:none;max-width:88%;overflow:hidden;text-overflow:ellipsis}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- 子节点侧栏：多词节点免拖拽，点一下直接跳 ---------- */
#rail{position:absolute;top:9px;bottom:9px;left:9px;width:158px;z-index:8;display:none;flex-direction:column;
background:rgba(255,253,250,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid #e7e0d1;border-radius:12px;
box-shadow:0 18px 40px -26px rgba(30,40,54,.55);overflow:hidden}
#rail.on{display:flex;animation:railIn .24s cubic-bezier(.22,.61,.36,1) both}
#rail.right.on{animation-name:railInR}
@keyframes railIn{from{opacity:0;transform:translateX(-8px) scale(.985)}to{opacity:1;transform:none}}
@keyframes railInR{from{opacity:0;transform:translateX(8px) scale(.985)}to{opacity:1;transform:none}}
#rail.fresh .ri{animation:riIn .24s cubic-bezier(.22,.61,.36,1) both;animation-delay:calc(var(--i) * 18ms)}
@keyframes riIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
#rail.right{left:auto;right:9px}
#rail .rh{display:flex;align-items:center;gap:6px;padding:9px 10px 8px;border-bottom:1px solid #efe7d7;color:#2b3340;flex:none}
#rail .rh b{font-size:12.5px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#rail .rh em{font-style:normal;font-size:10.5px;color:#9a927f;margin-left:auto;flex:none;letter-spacing:.2px}
#rail .rh button{border:0;background:none;color:#b3aa9a;font-size:15px;line-height:1;cursor:pointer;padding:2px 3px;border-radius:5px;flex:none}
#rail .rh button:hover{color:#a8552f;background:#f7f1e4}
#rail .rl{flex:1;min-height:0;overflow:auto;padding:4px 4px 8px}
#rail .ri{display:flex;align-items:baseline;gap:6px;width:100%;text-align:left;background:none;border:0;border-radius:7px;padding:6px 8px;cursor:pointer;
font-family:inherit;font-size:12px;color:#3b4351;line-height:1.45;transition:background .16s,color .16s}
#rail .ri:hover{background:#f7f1e4;color:#241a12}
#rail .ri:focus-visible{outline:2px solid #a8552f;outline-offset:-2px}
#rail .ri .rn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
#rail .ri .rm{font-size:11px;color:#8b919b;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
#rail .rgrip{position:absolute;top:0;bottom:0;width:9px;cursor:col-resize;touch-action:none}
#rail.left .rgrip{right:-2px}
#rail.right .rgrip{left:-2px}
#railTab{position:absolute;top:50%;transform:translateY(-50%);left:0;width:16px;height:64px;padding:0;border:1px solid #e7e0d1;border-left:0;border-radius:0 8px 8px 0;
background:rgba(255,253,250,.94);color:#b0a897;font:13px/1 inherit;cursor:pointer;display:none;z-index:8;box-shadow:0 6px 18px -12px rgba(30,40,54,.4)}
#railTab.on{display:flex;align-items:center;justify-content:center}
#railTab.right{left:auto;right:0;border:1px solid #e7e0d1;border-right:0;border-radius:8px 0 0 8px}
/* 手机：侧栏改成底部抽屉，避免两侧没空间；拖动改高，拖到很矮就收起 */
@media (max-width:779px){
  #rail{left:8px;right:8px;top:auto;bottom:8px;width:auto!important;max-height:44%;border-radius:12px}
  #rail.right{left:8px;right:8px}
  #rail .rgrip{top:-6px;bottom:auto;left:0;right:0;width:auto;height:12px;cursor:row-resize}
  #railTab{left:50%;right:auto;top:auto;bottom:0;transform:translateX(-50%);width:58px;height:16px;border:1px solid #e7e0d1;border-bottom:0;border-radius:8px 8px 0 0}
  #railTab.right{left:50%;right:auto;border:1px solid #e7e0d1;border-bottom:0;border-radius:8px 8px 0 0}
  #railTab.on{display:flex}
}
.node.lit{box-shadow:0 0 0 2px rgba(217,87,26,.5),0 12px 26px -14px rgba(30,40,54,.4)!important;animation:litPulse .72s cubic-bezier(.22,.61,.36,1)}
@keyframes litPulse{0%{transform:scale(.97)}40%{transform:scale(1.025)}100%{transform:scale(1)}}
#findBar{display:none;margin-top:8px;position:relative}
#findBar.on{display:block}
#q{width:100%;height:36px;font-size:16px;border-radius:9px;border:1px solid #ddd4c2;background:#fff;
padding:0 12px;font-family:inherit;color:#1e2836;outline:none;-webkit-appearance:none}
#q:focus{border-color:#a8552f;box-shadow:0 0 0 3px rgba(168,85,47,.1)}
#hits{position:absolute;left:0;right:0;top:100%;margin-top:6px;background:#fff;border:1px solid #e7e0d1;
border-radius:10px;box-shadow:0 10px 28px rgba(30,40,54,.16);max-height:44vh;overflow:auto;z-index:7;display:none}
#hits.on{display:block}
.hitrow{display:flex;align-items:baseline;gap:7px;padding:12px;border-bottom:1px solid #f2ece0;cursor:pointer}
.hitrow:last-child{border-bottom:0}
.hitrow:active{background:#faf6ec}
.hitrow b{font-size:13.5px;color:#222c3a;flex:0 0 auto}
.hitrow u{font-size:12px;color:#7b8390;text-decoration:none;flex:1;min-width:0;white-space:nowrap;overflow:hidden}
.hitrow i{font-size:10.5px;color:#a89f8c;font-style:normal;flex:0 0 auto;max-width:44%;white-space:nowrap;overflow:hidden}
.hitrow mark{background:#ffe9a8;color:inherit}
#hits .none{padding:12px;font-size:12.5px;color:#9a927f;text-align:center}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;
font-size:13px;color:#98907f;pointer-events:none;padding:24px}
@media (max-width:430px){.tab{font-size:12.5px}.mini{padding:0 8px;font-size:12px}.progress{width:54px}}
</style>
</head>
<body>
<header>
  <div class="tabs" id="tabs"></div>
  <div class="bar">
    <div class="stat" id="stat"></div>
    <div class="progress"><i id="pbar"></i></div>
    <button class="mini" id="randomBtn" type="button">随机</button>
    <button class="mini" id="undoneBtn" type="button">未掌握</button>
    <button class="mini" id="doneBtn" type="button">已掌握</button>
    <button class="mini" id="unkBtn" type="button" title="长按单词可加入生词本">生词本</button>
    <button class="mini" id="findBtn" type="button">找词</button>
    <button class="mini" id="expand" type="button">展开</button>
    <button class="mini" id="collapse" type="button">收起</button>
    <button class="mini" id="fit" type="button">复位</button>
  </div>
  <div id="findBar">
    <input id="q" type="search" placeholder="输入单词或中文释义，如 consider、巨大" autocomplete="off" spellcheck="false">
    <div id="hits"></div>
  </div>
</header>
<main id="viewport">
  <div id="canvas"></div>
  <div id="toast"></div>
  <aside id="rail" class="left">
    <div class="rh"><b id="railTitle"></b><em id="railCount"></em><button id="railClose" type="button" title="关闭侧栏">×</button></div>
    <div class="rl" id="railList"></div>
    <span class="rgrip" id="railGrip"></span>
  </aside>
  <button id="railTab" type="button" title="展开侧栏">›</button>
  <div id="empty"><div>正在生成图谱<br><span style="font-size:11px">若一直停在这里，说明当前打开方式没有运行网页脚本，请改用 Safari 或 Chrome 打开</span></div></div>
</main>
<script>
window.addEventListener("error",function(ev){var em=document.getElementById("empty");if(em){em.style.display="flex";
em.innerHTML="<div>加载出错："+(ev.message||"未知错误")+"</div>";}});

function computeDead(){
  (function walk(n){
    if(n.k === 'word'){ n._dead = filterDone ? !n.done : (filterUndone && n.done); return; }
    if(n.k === 'dv'){ n._dead = n.p ? !!n.p._dead : false; return; }
    let any = false;
    if(n.c) n.c.forEach(function(c){ walk(c); if(!c._dead) any = true; });
    n._dead = !any;
  })(root);
}
function layout(){
  visible = [];
  computeDead();
  const kids = (root.c || []).filter(function(n){ return !n._dead; });
  const half = Math.ceil(kids.length / 2);
  const right = kids.slice(0, half);
  const left = kids.slice(half);
  root.x = 0;
  root.cy = 0;
  const rootLeft = 0, rootRight = root.w;

  function collect(list){
    const dW = [];
    function walk(n, d){
      visible.push(n);
      if(n.w > (dW[d] || 0)) dW[d] = n.w;
      if(n.c && !n.collapsed && n.c.length) n.c.forEach(function(c){ if(!c._dead) walk(c, d + 1); });
    }
    list.forEach(function(n){ walk(n, 0); });
    return dW;
  }
  const dWr = collect(right), dWl = collect(left);

  function offs(dW){
    const o = [];
    let a = 0;
    for(let d = 0; d < dW.length; d++){ o[d] = a; a += dW[d] + GAP; }
    return o;
  }
  const oR = offs(dWr), oL = offs(dWl);

  function place(list, dir, o){
    let cur2 = 0;
    function go(n, d){
      const alive = (n.c || []).filter(function(c){ return !c._dead; });
      if(n.c && !n.collapsed && alive.length){
        alive.forEach(function(c){ go(c, d + 1); });
        n.cy = (alive[0].cy + alive[alive.length - 1].cy) / 2;
      } else {
        n.cy = cur2 * ROW + ROW / 2;
        cur2++;
      }
      n.x = dir > 0 ? rootRight + GAP + (o[d] || 0) : rootLeft - GAP - (o[d] || 0) - n.w;
    }
    list.forEach(function(n){ go(n, 0); });
    return cur2 * ROW;
  }
  const Hr = place(right, 1, oR);
  const Hl = place(left, -1, oL);

  function shift(list, off){
    function go(n){ n.cy += off; if(n.c && !n.collapsed) n.c.forEach(function(c){ if(!c._dead) go(c); }); }
    list.forEach(go);
  }
  const total = Math.max(Hr, Hl, root.h);
  shift(right, (total - Hr) / 2);
  shift(left, (total - Hl) / 2);
  root.cy = total / 2;

  visible.push(root);
  let minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
  visible.forEach(function(n){
    n.y = n.cy - n.h / 2;
    if(n.x < minX) minX = n.x;
    if(n.y < minY) minY = n.y;
    if(n.x + n.w > maxX) maxX = n.x + n.w;
    if(n.y + n.h > maxY) maxY = n.y + n.h;
  });
  const dx = -minX, dy = -minY;
  visible.forEach(function(n){ n.x += dx; n.y += dy; n.cy += dy; });
  W = Math.round(maxX - minX);
  H = Math.round(maxY - minY);
}

function apply(){
  canvas.style.transform = 'translate(' + Math.round(tx) + 'px,' + Math.round(ty) + 'px) scale(' + scale + ')';
  canvas.classList.add('moving');
  clearTimeout(apply._t);
  apply._t = setTimeout(function(){ canvas.classList.remove('moving'); void canvas.offsetWidth; }, 160);
}

function nodeHTML(n, side){
  const s = styleOf(n);
  let cls = 'node k-' + n.k + ' lv' + n.lv;
  if(n.k === 'dv' && n.hot) cls += ' hot';
  if(n.done) cls += ' done';
  else if(n.unknown) cls += ' unk';
  if(side === 'l') cls += ' left';
  let inner = '';
  if(n.k === 'word'){
    inner = '<span class="w">' + esc(n.n) + '</span>' +
      (n.po ? '<span class="po">' + esc(n.po) + '</span>' : '') +
      
      (n.d ? '<span class="m">' + esc(n.d) + '</span>' : '');
  } else if(n.k === 'dv'){
    inner = '<span class="dv">' + esc(n.n) + '</span>' +
      (n.po ? '<span class="po dvpo">' + esc(n.po) + '</span>' : '') +
      (n.d ? '<span class="dm">' + esc(n.d) + '</span>' : '');
  } else if(n.k === 'seg' || n.k === 'cat'){
    inner = '<span class="lab">' + esc(n.n) + '</span>';
  } else {
    inner = '<span class="n">' + esc(n.n) + '</span>';
  }
  let sym = '';
  if(n.c && n.c.length && n.k !== 'word') sym = n.collapsed ? '+' : '−';
  else if(n.done) sym = '✓';
  else if(n.unknown) sym = '!';
  const accent = (n.k === 'group' || n.k === 'topic');
  const st = accent ? (side === 'l' ? 'border-right-color:' + n.color + ';' : 'border-left-color:' + n.color + ';') : '';
  const padL = (accent ? s.padL - 4 : s.padL) + 'px';
  const padR = (s.padR + s.sym) + 'px';
  const pad = side === 'l' ? 'padding-right:' + padL + ';padding-left:' + padR + ';' : 'padding-left:' + padL + ';padding-right:' + padR + ';';
  return '<div class="' + cls + '" data-id="' + n.id + '" style="left:' + n.x + 'px;top:' + n.y + 'px;width:' + n.w +
    'px;height:' + n.h + 'px;' + pad + st + '">' +
    inner + (sym ? '<span class="sym">' + sym + '</span>' : '') + '</div>';
}

function render(){
  // 先记住上一帧各节点的位置，重排后做 FLIP 补间（节点太多时跳过，保帧率）
  const prev = {};
  const olds0 = canvas.querySelectorAll('.node');
  const flipOn = olds0.length <= 620;
  if(flipOn){
    for(let i = 0; i < olds0.length; i++){
      const el = olds0[i];
      prev[el.dataset.id] = { l: parseFloat(el.style.left) || 0, t: parseFloat(el.style.top) || 0 };
    }
  }
  layout();
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  const seen = {};
  visible.forEach(function(n){ seen[n.id] = 1; });
  let paths = '', nodes = '';
  const cx0 = root.x + root.w / 2;
  visible.forEach(function(n){
    if(n.p && seen[n.p.id]){
      const p = n.p;
      const toRight = (n.x + n.w / 2) > (p.x + p.w / 2);
      const x1 = toRight ? p.x + p.w : p.x;
      const y1 = p.y + p.h / 2;
      const x2 = toRight ? n.x : n.x + n.w;
      const y2 = n.y + n.h / 2;
      const mx = (x2 - x1) / 2;
      const accent2 = (n.k === 'group' || n.k === 'topic');
      const c = accent2 ? n.color : '#ded7c8';
      paths += '<path d="M' + x1 + ' ' + y1 + ' C' + (x1 + mx) + ' ' + y1 + ' ' + (x2 - mx) + ' ' + y2 + ' ' + x2 + ' ' + y2 +
        '" stroke="' + c + '" stroke-opacity="' + (accent2 ? 0.5 : 0.72) + '" stroke-width="' + (accent2 ? 1.6 : 1.3) + '"/>';
    }
    nodes += nodeHTML(n, (n !== root && (n.x + n.w / 2) < cx0) ? 'l' : 'r');
  });
  canvas.innerHTML = '<svg width="' + W + '" height="' + H + '" fill="none" stroke-width="1.4" stroke-linecap="round" ' +
    'style="position:absolute;left:0;top:0">' + paths + '</svg>' + nodes;
  if(flipOn){
    const els = canvas.querySelectorAll('.node');
    for(let i = 0; i < els.length; i++){
      const el = els[i], n = byId[el.dataset.id];
      const p = prev[el.dataset.id];
      if(!n) continue;
      if(p){
        const dx = p.l - n.x, dy = p.t - n.y;
        if(Math.abs(dx) > 0.4 || Math.abs(dy) > 0.4){
          el.classList.add('anim');
          el.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
          void el.offsetWidth;
          el.style.transform = '';
          setTimeout(function(){ el.classList.remove('anim'); }, 480);
        }
      } else if(el.classList.contains('k-word') || n.k === 'seg' || n.k === 'cat' || n.k === 'dv'){
        el.classList.add('enter');
        setTimeout(function(){ el.classList.remove('enter'); }, 360);
      }
    }
  }
  apply();
  railSync();
  const em = document.getElementById('empty');
  if(em) em.style.display = 'none';
}

function fit(animate){
  const cw = viewport.clientWidth || window.innerWidth;
  const ch = viewport.clientHeight || window.innerHeight;
  let s2 = Math.min(1.12, (cw - 26) / W, (ch - 30) / H);
  if(!isFinite(s2) || s2 <= 0) s2 = 1;
  if(s2 < 0.66) s2 = 0.66;
  const x2 = Math.round((cw - W * s2) / 2), y2 = Math.round((ch - H * s2) / 2);
  if(animate) flyTo(x2, y2, s2, 380);
  else { scale = s2; tx = x2; ty = y2; apply(); }
}

function focusSubtree(top){
  let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
  visible.forEach(function(n){
    let p = n, ok = false;
    while(p){ if(p === top){ ok = true; break; } p = p.p; }
    if(!ok) return;
    if(n.x < minX) minX = n.x;
    if(n.x + n.w > maxX) maxX = n.x + n.w;
    if(n.y < minY) minY = n.y;
    if(n.y + n.h > maxY) maxY = n.y + n.h;
  });
  if(minX > maxX) return;
  const cw = viewport.clientWidth, ch = viewport.clientHeight;
  const bw = maxX - minX, bh = maxY - minY;
  let sc = Math.min(1.05, (cw - 52) / bw, (ch - 52) / bh);
  if(!isFinite(sc) || sc <= 0) sc = 1;
  const s2 = Math.max(0.72, Math.min(1.05, sc));
  flyTo(Math.round(cw / 2 - ((minX + maxX) / 2) * s2), Math.round(ch / 2 - ((minY + maxY) / 2) * s2), s2, 420);
}

function zoomAt(cx, cy, f){
  const r = viewport.getBoundingClientRect();
  const x = cx - r.left, y = cy - r.top;
  const ns = Math.max(0.12, Math.min(2.5, scale * f));
  tx = x - (x - tx) * ns / scale;
  ty = y - (y - ty) * ns / scale;
  scale = ns;
  apply();
}

/* ---------- 手势 ---------- */
let drag = null, pinch = null, suppress = 0, moved = 0;
viewport.addEventListener('touchstart', function(e){
  moved = 0;
  if(e.touches.length === 2){
    const a = e.touches[0], b = e.touches[1];
    pinch = {d: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY), s: scale,
             mx: (a.clientX + b.clientX) / 2, my: (a.clientY + b.clientY) / 2, tx: tx, ty: ty};
    drag = null;
  } else if(e.touches.length === 1){
    drag = {x: e.touches[0].clientX, y: e.touches[0].clientY, tx: tx, ty: ty};
    pinch = null;
  }
}, {passive: true});

viewport.addEventListener('touchmove', function(e){
  if(pinch && e.touches.length === 2){
    e.preventDefault();
    const a = e.touches[0], b = e.touches[1];
    const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    const ns = Math.max(0.12, Math.min(2.5, pinch.s * (d / pinch.d)));
    const r = viewport.getBoundingClientRect();
    const x = pinch.mx - r.left, y = pinch.my - r.top;
    tx = x - (x - pinch.tx) * ns / pinch.s;
    ty = y - (y - pinch.ty) * ns / pinch.s;
    scale = ns;
    apply();
  } else if(drag && e.touches.length === 1){
    e.preventDefault();
    const dx = e.touches[0].clientX - drag.x;
    const dy = e.touches[0].clientY - drag.y;
    moved = Math.max(moved, Math.hypot(dx, dy));
    tx = drag.tx + dx;
    ty = drag.ty + dy;
    apply();
  }
}, {passive: false});

viewport.addEventListener('touchend', function(e){
  if(moved > 8) suppress = Date.now() + 300;
  if(e.touches.length === 0){ drag = null; pinch = null; }
  else if(e.touches.length === 1){
    drag = {x: e.touches[0].clientX, y: e.touches[0].clientY, tx: tx, ty: ty};
    pinch = null; moved = 99;
  }
}, {passive: true});

viewport.addEventListener('wheel', function(e){
  e.preventDefault();
  zoomAt(e.clientX, e.clientY, e.deltaY < 0 ? 1.12 : 0.89);

viewport.addEventListener('mousedown', function(e){

/* ---------- 展开一个节点时，其他分支一起收起，视野只跟着这条线 ---------- */
function isAnc(a, b){
  let p = b && b.p;
  while(p){ if(p === a) return true; p = p.p; }
  return false;
}
function collapseOthers(target){
  (function walk(x){
    if(!x || !x.c) return;
    const keep = (x === target) || isAnc(x, target) || isAnc(target, x);
    if(!keep && !x.collapsed) x.collapsed = true;
    if(x === target) return;               /* 目标自己的层级保持原样 */
    x.c.forEach(walk);
  })(root);
}

let camAnim = 0;

/* 统一的镜头飞行：点击跳转、随机、搜索命中都用同一套缓动与时长 */
function flyTo(x2, y2, s2, dur, done){
  cancelAnimationFrame(camAnim);
  if(s2 == null) s2 = scale;
  const x0 = tx, y0 = ty, s0 = scale;
  const d = Math.hypot(x2 - x0, y2 - y0);
  /* 镜头位移是导航反馈，不做 reduced-motion 降级：系统关了动画也要能看清飞到哪 */
  dur = dur || Math.max(300, Math.min(560, 300 + d * 0.45));
  const t0 = performance.now();
  canvas.classList.add('moving');
  function step(t){
    const p = Math.min(1, (t - t0) / dur);
    const e = 1 - Math.pow(1 - p, 3);   /* easeOutCubic：起步就有位移，落点稳 */
    tx = x0 + (x2 - x0) * e;
    ty = y0 + (y2 - y0) * e;
    scale = s0 + (s2 - s0) * e;
    apply();
    if(p < 1) camAnim = requestAnimationFrame(step);
    else { void canvas.offsetWidth; if(done) done(); }
  }
  camAnim = requestAnimationFrame(step);
}
function focusNode(id){
  const n = byId[id];
  if(!n) return;
  const r = viewport.getBoundingClientRect();
  const s2 = Math.max(scale, 0.92);
  flyTo(Math.round(r.width / 2 - (n.x + n.w / 2) * s2), Math.round(r.height / 2 - (n.y + n.h / 2) * s2), s2);
  const el = canvas.querySelector('.node[data-id="' + id + '"]');

    el.classList.add('lit');

  }
}

const DKEY = 'kaoyan_vocab_done_v3';
const UKEY = 'kaoyan_vocab_unk_v3';
function loadDone(){
  let arr = [];
  try{ arr = JSON.parse(localStorage.getItem(DKEY) || '[]'); }catch(e){ arr = []; }
  const set = {};
  arr.forEach(function(k){ set[k] = 1; });
  allNodes.forEach(function(n){
    if(n.k === 'word' && set[n.n + '|' + (n.d || '')]) n.done = true;
  });
  let uarr = [];

  const uset = {};
  uarr.forEach(function(k){ uset[k] = 1; });
  allNodes.forEach(function(n){
    if(n.k === 'word' && uset[n.n + '|' + (n.d || '')]) n.unknown = true;
  });
}
function syncWord(name, st){
  allNodes.forEach(function(o){
    if(o.k !== 'word' || o.ref || o.n !== name) return;
    if(st === 'done'){ o.done = true; o.unknown = false; }
    else if(st === 'unknown'){ o.done = false; o.unknown = true; }
    else { o.done = false; o.unknown = false; }
  });
}
function saveDone(){
  const out = [], unk = [];
  allNodes.forEach(function(n){
    if(n.k !== 'word' || n.ref) return;
    const k = n.n + '|' + (n.d || '');
    if(n.done) out.push(k);
    if(n.unknown) unk.push(k);
  });
  try{
    localStorage.setItem(DKEY, JSON.stringify(out));
    localStorage.setItem(UKEY, JSON.stringify(unk));
    localStorage.setItem('kaoyan_vocab_dirty_v1', '1');
  }catch(e){}
}

function updateStat(){

  let total = 0, done = 0;

    if(n.k === 'word' && !n.ref){ total++; if(n.done) done++; }
    else if(n.c) n.c.forEach(walk);
  })(root);

}

/* ---------- 学习功能：未掌握过滤 / 生词本 / 随机 ---------- */
let filterUndone = false, filterDone = false, mode = 'cat', unkIds = [];
let toastT = null;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = 'on';
  clearTimeout(toastT);
  toastT = setTimeout(function(){ el.className = ''; }, 1500);
}
function dropUnknownNodes(){
  if(!unkIds.length) return;
  const s = {};
  unkIds.forEach(function(id){ s[id] = 1; delete byId[id]; });
  allNodes = allNodes.filter(function(n){ return !s[n.id]; });
  unkIds = [];
}
function buildUnknown(){
  dropUnknownNodes();
  const groups = {}, names = ['语义辨析', '词根词缀', '熟词僻义', '考研全表'];
  const seenWord = {};
  INDEX.forEach(function(it){
    if(!it.node.unknown) return;
    const wkey = it.w.toLowerCase();
    if(seenWord[wkey]) return;
    seenWord[wkey] = 1;
    const tail = it.path.length ? it.path[it.path.length - 1] : names[it.ci];
    const key = (names[it.ci] || '') + ' · ' + tail;
    (groups[key] = groups[key] || []).push(it.node);
  });
  const kids = Object.keys(groups).map(function(k){
    const ws = groups[k].map(function(w){ return {n:w.n, d:w.d, k:'word', ref:w}; })
      .sort(function(a, b){ return a.n.toLowerCase() < b.n.toLowerCase() ? -1 : 1; });
    if(ws.length <= 30) return {n:k, k:'cat', c:ws};
    const segs = [];
    for(let i = 0; i < ws.length; i += 30){
      segs.push({n:'词 ' + (i + 1) + '–' + Math.min(i + 30, ws.length), k:'seg', c:ws.slice(i, i + 30)});
    }
    return {n:k, k:'cat', c:segs};
  });
  const start = allNodes.length;
  root = prep({n:'生词本', c:kids}, 0, null, '#b45309');
  unkIds = allNodes.slice(start).map(function(n){ return n.id; });
  (function openAll(n){ if(n.c){ n.collapsed = false; n.c.forEach(openAll); } })(root);
}
function countUnknown(){
  const seen = {};
  INDEX.forEach(function(it){ if(it.node.unknown) seen[it.w.toLowerCase()] = 1; });
  return Object.keys(seen).length;
}
function enterUnknown(){

function randomWord(){

  if(!pool.length){ toast('这一页的词都掌握了'); return; }
  const n = pool[Math.floor(Math.random() * pool.length)];
  let p = n.p;
  while(p){ if(p.c && p.c.length) p.collapsed = false; p = p.p; }
  render(); focusNode(n.id);
  toast(n.n + (n.d ? '  ' + n.d : ''));

/* ---------- 搜索 ---------- */
const INDEX = [];
function buildIndex(){
  CATS.forEach(function(r, ci){
    (function walk(n, path){
      if(n.k === 'word'){ INDEX.push({w:n.n, d:n.d || '', node:n, ci:ci, path:path}); return; }
      if(n.k === 'dv') return;
      if(n.c) n.c.forEach(function(c){ walk(c, path.concat(n.n)); });
    })(r, []);
  });
}
function centerOn(n){
  const cw = viewport.clientWidth, ch = viewport.clientHeight;
  const s2 = Math.min(1.05, Math.max(0.62, scale));
  flyTo(Math.round(cw / 2 - (n.x + n.w / 2) * s2), Math.round(ch / 2 - (n.y + n.h / 2) * s2), s2);
}
function flash(n){
  const el = canvas.querySelector('.node[data-id="' + n.id + '"]');
  if(!el) return;
  el.classList.add('hi');
  setTimeout(function(){ el.classList.remove('hi'); }, 1600);
}
function goTo(it){
  if(cur !== it.ci) switchCat(it.ci);
  let p = it.node.p;
  while(p){ if(p.c && p.c.length) p.collapsed = false; p = p.p; }
  render();
  focusNode(it.node.id);
  document.getElementById('hits').className = '';
  document.getElementById('findBar').classList.remove('on');
  document.getElementById('q').blur();
}
function hl(text, q){
  if(!q) return esc(text);
  const i = text.toLowerCase().indexOf(q);
  if(i < 0) return esc(text);
  return esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + q.length)) + '</mark>' + esc(text.slice(i + q.length));
}
let hitsCache = [];
function doSearch(){
  const raw = document.getElementById('q').value.trim();
  const q = raw.toLowerCase();
  const box = document.getElementById('hits');
  if(!q){ box.className = ''; box.innerHTML = ''; hitsCache = []; return; }
  const terms = q.split(/\s+/).filter(Boolean);
  const isCN = /[\u4e00-\u9fa5]/.test(q);
  const hits = [];
  for(let i = 0; i < INDEX.length; i++){
    const it = INDEX[i], w = it.w.toLowerCase(), d = it.d.toLowerCase();
    let s = -1;
    if(isCN){
      let ok = true;
      for(let t = 0; t < terms.length; t++){
        if(d.indexOf(terms[t]) < 0 && w.indexOf(terms[t]) < 0){ ok = false; break; }
      }
      if(!ok) continue;
      s = (d.indexOf(q) >= 0 || d.indexOf(q.replace(/、/g, '，')) >= 0) ? 0 : 1;
    } else if(terms.length === 1){
      if(w === q) s = 0;
      else if(w.indexOf(q) === 0) s = 1;
      else if(w.indexOf(q) > 0) s = 2;
      else if(d.indexOf(q) >= 0) s = 3;
      else continue;
    } else {
      let ok = true;
      for(let t = 0; t < terms.length; t++){
        if(w.indexOf(terms[t]) < 0 && d.indexOf(terms[t]) < 0){ ok = false; break; }
      }
      if(!ok) continue;
      s = w.indexOf(terms[0]) >= 0 ? 1 : 3;
    }
    hits.push({s:s, i:i, it:it});
  }
  hits.sort(function(a, b){
    return a.s - b.s || (a.s >= 3 ? a.it.d.length - b.it.d.length : 0) || a.it.w.length - b.it.w.length || a.i - b.i;
  });
  const top = hits.slice(0, 40);
  hitsCache = top.map(function(h){ return h.it; });
  const total = hits.length;
  if(!top.length){ box.innerHTML = '<div class="none">没有匹配的词义，换个说法试试</div>'; box.className = 'on'; return; }
  const catName = ['语义辨析', '词根词缀', '熟词僻义', '考研全表'];
  box.innerHTML = top.map(function(h, k){
    const it = h.it;
    const where = (catName[it.ci] || '') + (it.path.length > 1 ? ' · ' + it.path[it.path.length - 1] : '');
    return '<div class="hitrow" data-k="' + k + '"><b>' + hl(it.w, isCN ? '' : q) + '</b><u>' + hl(it.d, isCN ? terms[0] : q) + '</u><i>' + esc(where) + '</i></div>';
  }).join('') + '<div class="none">共 ' + total + ' 个匹配，显示前 ' + top.length + ' 个</div>';
  box.className = 'on';
}
document.getElementById('q').addEventListener('keydown', function(e){
  if(e.key !== 'Enter') return;
  e.preventDefault();
  if(hitsCache.length) goTo(hitsCache[0]);
});
document.getElementById('findBtn').addEventListener('click', function(){
  const bar = document.getElementById('findBar');
  bar.classList.toggle('on');
  if(bar.classList.contains('on')) setTimeout(function(){ const q = document.getElementById('q'); q.focus(); q.select(); }, 40);
  else { document.getElementById('hits').className = ''; }
});
const qEl = document.getElementById('q');
qEl.addEventListener('input', doSearch);
qEl.addEventListener('keydown', function(e){
  if(e.key === 'Enter'){ if(hitsCache[0]) goTo(hitsCache[0]); }
  if(e.key === 'Escape'){ document.getElementById('hits').className = ''; qEl.blur(); }
});
document.getElementById('hits').addEventListener('click', function(e){
  const row = e.target.closest('.hitrow');
  if(!row) return;
  const it = hitsCache[+row.dataset.k];
  if(it) goTo(it);
});

/* ---------- 按钮 ---------- */
document.getElementById('expand').addEventListener('click', function(){
  visible.forEach(function(n){
    if(n.c && n.c.length && n.collapsed) n.collapsed = false;
  });
  render(); fit(true);
  if(scale < 0.56){
    const cw = viewport.clientWidth, ch = viewport.clientHeight;
    scale = 0.56;
    tx = Math.round(cw / 2 - (root.x + root.w / 2) * scale);
    ty = Math.round(ch / 2 - (root.y + root.h / 2) * scale);
    apply();
  }
});
document.getElementById('collapse').addEventListener('click', function(){
  (function walk(n){
    if(n.c && n.c.length){ n.collapsed = !(n.c[0] && n.c[0].k === 'dv'); n.c.forEach(walk); }
  })(root);
  render(); fit(true);
});
document.getElementById('fit').addEventListener('click', function(){ render(); fit(true); });

/* ---------- 启动 ---------- */
loadDone();
buildIndex();
render();
fit();
updateStat();
