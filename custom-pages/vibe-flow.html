<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vibe Coding 全流程</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23f7f2ec'/%3E%3Cpath d='M10 20h4l4-8h4' stroke='%23d9571a' stroke-width='2.2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Serif+SC:wght@400;600;700&family=Playfair+Display:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../embed/frame.css">
<style>
:root{
  --bg:#f7f2ec;--panel-solid:#fffdfa;--text:#241a12;--text-dim:#564334;--muted:#8a7365;
  --line:rgba(126,84,46,.16);--line-strong:rgba(126,84,46,.32);
  --accent:#d9571a;--accent-soft:#b8641f;--accent-cream:#7c3611;
  --radius:18px;--radius-sm:12px;--ease:cubic-bezier(.22,.8,.2,1);
  --shadow:0 24px 60px -32px rgba(85,53,28,.3);--mono:'JetBrains Mono',ui-monospace,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100%;background:
radial-gradient(1000px 620px at 6% -14%,rgba(217,87,26,.08),transparent 64%),
radial-gradient(820px 560px at 96% 2%,rgba(220,150,90,.06),transparent 68%),var(--bg);
color:var(--text);font-family:'Inter',-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
line-height:1.6;-webkit-font-smoothing:antialiased;padding:24px 22px 34px}
.wrap{max-width:1080px;margin:0 auto}

/* 顶部：跨页导航与页头由 /embed/frame.css 统一提供 */
.master{border:1px solid rgba(217,87,26,.3);background:rgba(217,87,26,.06);color:var(--accent-cream);
border-radius:999px;padding:7px 14px;font:500 11.5px/1 'Inter',sans-serif;cursor:pointer;
transition:all .26s var(--ease)}
.master:hover{background:rgba(217,87,26,.12);transform:translateY(-1px)}

/* 阶段步进条：横向 6 段，当前段压橙色下划线 */
.shell{display:block}
.rail{position:static;display:flex;gap:4px;flex-wrap:wrap;align-items:stretch;
border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:11px}
.st{position:relative;flex:1 1 0;min-width:118px;display:flex;align-items:baseline;gap:7px;text-align:left;cursor:pointer;
border:0;border-bottom:2px solid transparent;border-radius:8px;padding:7px 9px 8px;background:none;
color:inherit;font:inherit;transition:background .24s var(--ease),border-color .28s var(--ease),transform .24s var(--ease)}
.st:hover{background:rgba(217,87,26,.05);transform:translateY(-1px)}
.st.on{background:rgba(217,87,26,.07);border-bottom-color:var(--accent)}
.st-no{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:#b9a48f;padding-top:0;transition:color .24s}
.st.on .st-no{color:var(--accent)}
.st.done .st-title::after{content:"✓";margin-left:4px;font-size:9px;color:var(--accent)}
.st-body{display:flex;flex-direction:column;gap:0;min-width:0}
.st-title{font-family:'Playfair Display','Noto Serif SC',serif;font-size:14.5px;font-weight:500;letter-spacing:.01em;white-space:nowrap}
.st.on .st-title{color:var(--accent-cream)}
.st-goal{display:none}
.st-dot{display:none}
.rail-note{margin:8px 0 0;font-size:10.5px;color:#a08f7e;line-height:1.7;padding:0 2px}

/* 阶段面板：占满整行，正文分主 / 侧两栏 */
.pane{border:1px solid var(--line);border-radius:var(--radius);background:linear-gradient(180deg,#fffdfa,#fdfaf5);
box-shadow:0 20px 44px -36px rgba(85,53,28,.7);overflow:hidden}
.pane-head{position:relative;display:flex;align-items:flex-start;gap:14px;padding:7px 22px 5px;border-bottom:1px dashed var(--line);
background:rgba(217,87,26,.03)}
.pno{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--accent)}
.pane-head h2{font-family:'Playfair Display','Noto Serif SC',serif;font-weight:500;font-size:23px;margin-top:2px}
.pmeta{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:#a08f7e;margin-top:4px}


.copyp{margin-left:auto;flex:none;border:1px solid rgba(217,87,26,.3);background:rgba(217,87,26,.06);color:var(--accent-cream);
border-radius:999px;padding:7px 13px;font:500 11px/1 'Inter',sans-serif;cursor:pointer;transition:all .26s var(--ease)}
.copyp:hover{background:rgba(217,87,26,.12);transform:translateY(-1px)}
.copyp.done{background:rgba(217,87,26,.16);border-color:rgba(217,87,26,.5)}
.phead-actions{display:flex;align-items:center;justify-content:flex-end;gap:6px;flex-wrap:wrap;margin-left:auto}
.phead-actions .copyp{margin-left:0}
.copyp.ghost{background:rgba(255,253,250,.6);border-color:var(--line);color:var(--text-dim)}
.copyp.ghost:hover{border-color:rgba(217,87,26,.35);color:var(--accent-cream)}
.prog{font-family:var(--mono);font-size:9px;letter-spacing:.08em;color:var(--accent-cream);
border:1px solid rgba(217,87,26,.18);background:rgba(217,87,26,.05);border-radius:999px;padding:4px 8px}
.pane-body{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.7fr);column-gap:26px;
padding:7px 22px 5px}
.pane-body>.scol{display:flex;flex-direction:column;min-width:0}
.stage-nav{display:flex;align-items:center;gap:10px;padding:6px 22px 7px;border-top:1px dashed var(--line)}
.navbtn{border:1px solid var(--line);background:rgba(255,253,250,.72);border-radius:999px;padding:6px 12px;
font:500 11px/1 'Inter',sans-serif;color:var(--text-dim);cursor:pointer;transition:all .24s var(--ease)}
.navbtn:hover:not(:disabled){border-color:rgba(217,87,26,.35);color:var(--accent-cream);transform:translateY(-1px)}
.navbtn:disabled{opacity:.35;cursor:not-allowed}
.nav-count{margin-left:auto;font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:#a08f7e}
.sec{margin-top:7px}
.sec>h3{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-soft);margin-bottom:7px}
.sec>p{font-size:13.5px;color:#5f574e;line-height:1.75}

/* 步骤：一行一张小卡，编号在左，产出在右 */
.steps{list-style:none;display:grid;gap:3px;margin-top:2px}
.steps li{position:relative;display:flex;gap:8px;padding:4px 9px 5px 23px;cursor:pointer;
border:1px solid var(--line);border-radius:10px;background:rgba(255,253,250,.55);
transition:background .26s var(--ease),border-color .26s var(--ease),transform .26s var(--ease),box-shadow .3s var(--ease)}
.steps li.done{background:rgba(217,87,26,.05);border-color:rgba(217,87,26,.24)}
.steps li.done .n{color:var(--accent)}
.steps li.done .n::after{content:"✓";margin-left:2px;font-size:8px}
.steps li.done .do{color:#7d6a5b}
.steps li:hover{background:#fffefb;border-color:rgba(217,87,26,.3);transform:translateY(-1px);
box-shadow:0 10px 20px -20px rgba(140,70,30,.55)}
.steps li::before{content:"";position:absolute;left:10px;top:14px;width:6px;height:6px;border-radius:50%;
background:rgba(217,87,26,.5);box-shadow:0 0 0 3px rgba(217,87,26,.06);transition:box-shadow .3s var(--ease)}
.steps li:hover::before{box-shadow:0 0 0 5px rgba(217,87,26,.14)}
.steps li::after{display:none}
.n{font-family:var(--mono);font-size:9px;color:#b9a48f;padding-top:3px;flex:none}
.do{font-size:13px;color:var(--text-dim);line-height:1.55}
.out{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:2px;font-size:11.5px;color:var(--muted);line-height:1.55}
.tlink{font-family:var(--mono);font-size:10px;color:var(--accent);text-decoration:none;border-bottom:1px solid rgba(217,87,26,.28);padding-bottom:1px}
.tlink:hover{color:var(--accent-cream)}
.gain{color:var(--text-dim)}
.gain b{font-weight:600;color:var(--accent-cream)}

/* 验收 */
.check{list-style:none;display:flex;flex-direction:column;gap:5px}
.deliver{display:flex;flex-wrap:wrap;gap:5px}
.deliver span{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;color:var(--accent-cream);
background:rgba(217,87,26,.06);border:1px solid rgba(217,87,26,.18);border-radius:6px;padding:3px 7px}
.check li{font-size:12.5px;color:#5f574e;display:flex;gap:7px;line-height:1.65}
.check svg{width:12px;height:12px;flex:none;margin-top:4px;color:rgba(217,87,26,.6)}
.trap{font-size:12.5px;color:#8a7365;padding:9px 11px;border-left:2px solid rgba(217,87,26,.35);
background:rgba(217,87,26,.04);line-height:1.7}

/* 细节折叠：默认收起，展开时高度、箭头、正文一起动 */
.detail{border:1px dashed var(--line-strong);border-radius:var(--radius-sm);background:rgba(255,253,250,.6);
overflow:hidden;transition:border-color .3s var(--ease),background .3s var(--ease)}
.detail.open{border-style:solid;border-color:rgba(217,87,26,.28);background:rgba(255,253,250,.9)}
.detail-btn{display:flex;align-items:center;gap:8px;width:100%;padding:10px 13px;border:0;background:none;cursor:pointer;
font:500 12.5px/1.2 'Inter',sans-serif;color:var(--accent-cream);text-align:left}
.detail-btn:hover{background:rgba(217,87,26,.05)}
.detail-btn .fold-ico{margin-left:auto;width:13px;height:13px;flex:none;color:var(--accent);transition:transform .36s var(--ease)}
.detail.open .fold-ico{transform:rotate(180deg)}
.detail-body{display:grid;grid-template-rows:0fr;opacity:0;
transition:grid-template-rows .44s var(--ease),opacity .3s ease}
.detail.open .detail-body{grid-template-rows:1fr;opacity:1}
.detail-inner{overflow:hidden}
.detail ul{padding:0 14px 13px;display:grid;gap:7px}
.detail li{font-size:12.5px;line-height:1.85;color:#5f574e;display:flex;gap:8px}
.detail li i{flex:none;width:4px;height:4px;border-radius:50%;background:rgba(217,87,26,.45);margin-top:8px}
.detail-refs{padding:0 13px 12px}
.detail-refs ul{display:grid;gap:6px;padding:0}
.detail-refs li{display:flex;flex-direction:column;gap:1px;font-size:10.5px;line-height:1.55}
.detail-refs a{font-family:var(--mono);font-size:10px;color:var(--accent);text-decoration:none}
.detail-refs a:hover{color:var(--accent-cream)}
.detail-refs span{color:var(--muted)}
.refs-wrap{margin:8px 14px 12px;padding-top:8px;border-top:1px dashed var(--line)}
.refs-h{font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:#b9a48f;margin-bottom:5px}
.detail .detail-refs{padding:0;display:grid;gap:5px}
.detail .detail-refs li{display:flex;flex-direction:column;gap:1px;font-size:10.5px;line-height:1.55}

font-size:10px;padding:3px 9px;cursor:pointer;color:var(--muted);font-family:'Inter',sans-serif;transition:all .24s var(--ease)}
.copy:hover{border-color:rgba(217,87,26,.4);color:var(--accent-cream)}
.copy.done{background:rgba(217,87,26,.12);border-color:rgba(217,87,26,.4);color:var(--accent-cream)}
.empty{display:flex;gap:9px;align-items:flex-start;padding:11px 12px;border:1px dashed var(--line-strong);
border-radius:var(--radius-sm);background:rgba(255,253,250,.6);font-size:11.5px;color:var(--muted);line-height:1.7}
.empty svg{width:13px;height:13px;flex:none;margin-top:3px;color:#b9a48f}
.empty b{color:var(--text-dim);font-weight:600}
.empty a{color:var(--accent);text-decoration:none;border-bottom:1px solid rgba(217,87,26,.3)}

/* 提示词只在复制按钮里，不渲染到页面上 */

footer{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);
line-height:1.9;display:flex;gap:12px;flex-wrap:wrap;align-items:baseline}
footer b{color:var(--accent-cream);font-weight:600}
footer a{color:var(--accent);text-decoration:none;border-bottom:1px solid rgba(217,87,26,.28)}
footer .ap{margin-left:auto;font-size:11px;color:var(--muted)}

@media (max-width:900px){
  .pane-body{grid-template-columns:1fr;column-gap:0;padding:10px 16px 8px}

  .stage-nav{flex-wrap:wrap}
}
@media (max-width:700px){
  .st{flex:1 1 40%;min-width:0;padding:8px 8px 9px}
  .st-title{font-size:13px}
  .pane-head{padding:14px 14px 12px;flex-wrap:wrap}
  .copyp{margin-left:0}
  .pane-body{padding:8px 14px}
  footer .ap{margin-left:0}
}
</style>
</head>
<body>
<div class="wrap">

      <button class="st" type="button" data-stage="3" aria-selected="false">

      <button class="st" type="button" data-stage="4" aria-selected="false">

      </button>
      <button class="st" type="button" data-stage="5" aria-selected="false">

      <button class="st" type="button" data-stage="7" aria-selected="false">
        <span class="st-no">07</span><span class="st-body"><span class="st-title">测试评审</span></span>
      </button>
      <button class="st" type="button" data-stage="8" aria-selected="false">
        <span class="st-no">08</span><span class="st-body"><span class="st-title">上线迭代</span></span>

    <main class="pane" id="pane" aria-live="polite">
      <div class="pane-head">
        
        <div>
          <span class="pno" id="pno">STAGE 01</span>
          <h2 id="ptitle">定需求</h2>
          <p class="pmeta" id="pmeta"></p>
        </div>
        <div class="phead-actions">
          <span class="prog" id="stageProg">0/5 步</span>
          <button class="copyp ghost" type="button" id="copyTpl">复制交付模板</button>
          <button class="copyp" type="button" id="copyPrompt">复制本阶段提示词</button>
        </div>

      <div class="pane-body" id="paneBody"></div>
      <div class="stage-nav">

        <span class="nav-count" id="navCount">01 / 08</span>
        <button class="navbtn" type="button" id="nextStage">下一阶段 →</button>

  <footer>
    <span>规则只有一条：<b>验收不过就退回上一阶段</b>，别带着问题往下走。流程参考 <a href="https://yun.itheima.com/course/1100.html" target="_blank" rel="noopener noreferrer">黑马 SDD</a> · <a href="https://github.com/github/spec-kit" target="_blank" rel="noopener noreferrer">Spec Kit</a> · <a href="https://github.com/bmad-code-org/BMAD-METHOD" target="_blank" rel="noopener noreferrer">BMAD</a>。</span>
    <span class="ap">做完站点想顺手做条宣传片：<a href="https://github.com/harry0703/MoneyPrinterTurbo" target="_blank" rel="noopener noreferrer">MoneyPrinterTurbo ↗</a>（开源，给主题自动出短视频）</span>
  </footer>

<script src="../embed/frame.js" defer></script>
<script>
const railItems = [...document.querySelectorAll('.st')]
const pane = document.getElementById('pane')
const pno = document.getElementById('pno')
const ptitle = document.getElementById('ptitle')
const pmeta = document.getElementById('pmeta')
const paneBody = document.getElementById('paneBody')
const copyPrompt = document.getElementById('copyPrompt')
const copyTpl = document.getElementById('copyTpl')
const stageProg = document.getElementById('stageProg')
const copyMaster = document.getElementById('copyMaster')
const navCount = document.getElementById('navCount')
const prevStage = document.getElementById('prevStage')
const nextStage = document.getElementById('nextStage')

let current = 1
let currentPrompt = ''

const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12l5 5L20 6"/></svg>'
const FOLD = '<svg class="fold-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>'

// 八阶段：按黑马 Vibe Coding / SDD 的交付顺序排，工具与产出都落到具体动作
const STAGES = [
  {
    n: 1,
    title: '备环境',
    meta: '5 步 · 1 份开发宪法',
    deliver: ['环境清单', '规则文件', '首个 commit'],
    goal: '先把「命令能跑、模型能连、代码能提交」三件事做掉，再让 AI 碰业务。',
    steps: [
      { do: '按语言装运行时：JS→Node 20、Python→3.12、Java→JDK 21、Go→1.22，版本写进 README。', tool: ['Node.js（示例）', 'https://nodejs.org'], gain: '运行时 + 版本清单' },
      { do: '装包管理器与虚拟环境：pnpm / uv / Maven / go mod，锁版本，别混用全局。', tool: ['uv（示例）', 'https://docs.astral.sh/uv'], gain: '依赖锁定 + 虚拟环境' },
      { do: '装一个 AI 编程工具：Claude Code / Cursor / Codex / Trae 任选，登录并把 key 放进 .env。', tool: ['Claude Code（示例）', 'https://docs.anthropic.com/en/docs/claude-code'], gain: '工具能对话、能改文件' },
      { do: '建仓库，写 .gitignore（node_modules / dist / .env），打第一个 commit。', tool: ['Git', 'https://git-scm.com'], gain: '干净基线 + 首个 commit' },
      { do: '写开发宪法：技术栈、目录、常用命令、禁区、提交规范；文件名按工具选。', tool: ['AGENTS.md 规范', 'https://agents.md'], gain: '项目宪法（CLAUDE.md / AGENTS.md）' }
    ],
    checks: [
      'node -v、python -V、git -v 三条命令都有版本输出',
      'AI 工具能读规则文件，并复述出技术栈和禁区',
      'git log 有首个提交，.env 没有进仓库',
      '换一台机器照 README 能重装一遍'
    ],
    trap: '先写页面再补环境，报错时分不清是代码问题还是环境问题；先把工具链钉死。',
    details: [
      '版本用语言自己的管理工具（nvm / pyenv / sdkman / asdf），别用系统自带老版本；依赖锁进 lock 文件。',
      'key 只放 .env，.env 进 .gitignore；客户端代码里出现 key 就等于公开。',
      '规则文件名按工具：Claude Code 用 CLAUDE.md，Codex 用 AGENTS.md，Cursor 用 .cursorrules 或 .cursor/rules；内容不用为工具改。',

const PROMPT_TAIL = `

输出要求：
1. 先用一句话复述目标与验收口径，等我确认再动手；
2. 列要新增 / 修改的文件（路径 + 作用），我确认后再写；
3. 代码或文档给完整内容，不用「其余同上」省略；
4. 结尾给验证方法：命令或点击路径，能重跑一遍；
5. 有不确定的地方直接说不确定，别编。`

async function copyText(text, btn, doneLabel = '已复制') {
  try { await navigator.clipboard.writeText(text) }
  catch (err) {
    const ta = document.createElement('textarea')
    ta.value = text
    document.body.appendChild(ta)
    ta.select()
    document.execCommand('copy')
    ta.remove()
  }
  if (!btn) return
  const old = btn.textContent
  btn.textContent = doneLabel
  btn.classList.add('done')
  setTimeout(() => { btn.textContent = old; btn.classList.remove('done') }, 1400)
}

function stepsMarkup(s) {
  return s.steps.map((st, i) => {
    const tool = st.tool
      ? `<a class="tlink" href="${st.tool[1]}" target="_blank" rel="noopener noreferrer">${st.tool[0]}</a>`
      : `<span>${st.note || '不用外部工具'}</span>`
    return `<li data-step="${i}" role="checkbox" aria-checked="false" tabindex="0"><span class="n">0${i + 1}</span><div><p class="do">${st.do}</p>
      <div class="out">${tool}<span class="gain">→ 得到 <b>${st.gain}</b></span></div></div></li>`
  }).join('')
}

function refsMarkup(s) {
  const refs = REFS[s.n] || []
  if (!refs.length) return ''
  return `<div class="refs-wrap"><p class="refs-h">同一件事，其他工作流怎么做</p><ul class="detail-refs">${refs.map((r) => `<li><a href="${r.url}" target="_blank" rel="noopener noreferrer">${r.name} ↗</a><span>${r.note}</span></li>`).join('')}</ul></div>`
}

function stageMarkup(s) {
  return `<div class="scol main">
      <section class="sec"><h3>目标</h3><p>${s.goal}</p></section>
      <section class="sec"><h3>步骤 · 做什么 / 用什么 / 得到什么</h3><ul class="steps">${stepsMarkup(s)}</ul></section>
    </div>
    <div class="scol side">
      <section class="sec"><h3>本阶段产出</h3><div class="deliver">${s.deliver.map((d) => `<span>${d}</span>`).join('')}</div></section>
      <section class="sec"><h3>验收</h3><ul class="check">${s.checks.map((c) => `<li>${CHECK}${c}</li>`).join('')}</ul></section>
      <section class="sec"><h3>常见翻车</h3><p class="trap">${s.trap}</p></section>
      <section class="sec detail"><button class="detail-btn" type="button" aria-expanded="false">
          <span>展开细节 · 容易忽略的地方</span>${FOLD}
        </button>
        <div class="detail-body"><div class="detail-inner"><ul>${s.details.map((t) => `<li><i></i><span>${t}</span></li>`).join('')}</ul>${refsMarkup(s)}</div></div>
      </section>
    </div>`
}

function buildPrompt(s) {
  const toolLine = (st) => st.tool
    ? `工具/网站：${st.tool[0]}（${st.tool[1]}）`
    : `工具/网站：${st.note || '不用外部工具'}`
  const flows = s.steps.map((st, i) => `${i + 1}. 做什么：${st.do}\n   ① ${toolLine(st)}\n   ② 产出：${st.gain}`)
  let text = s.prompt.trim()
  text += '\n\n执行流程（按顺序做，每步先说清用什么工具、产出什么，我确认后再下一步）：\n' + flows.join('\n')
  text += '\n\n本阶段验收标准：\n' + s.checks.map((c, i) => `${i + 1}. ${c}`).join('\n')
  text += '\n\n需要你（用户）配合的事，别替我猜：\n' + s.user.map((t, i) => `${i + 1}. ${t}`).join('\n')
  text += '\n\n实践要点：\n' + s.details.map((t, i) => `${i + 1}. ${t}`).join('\n')
  return text + PROMPT_TAIL
}

function doneKey(n) { return 'vibe:done:' + n }

function syncProg() {
  const items = [...paneBody.querySelectorAll('.steps li')]
  if (!items.length) return stageProg.textContent = '— 步'
  const done = items.filter((li) => li.classList.contains('done')).length
  stageProg.textContent = `${done}/${items.length} 步`
  stageProg.classList.toggle('all', done === items.length)
}

function restoreDone(n) {
  let saved = []
  try { saved = JSON.parse(localStorage.getItem(doneKey(n)) || '[]') } catch (err) { saved = [] }
  paneBody.querySelectorAll('.steps li').forEach((li) => {
    const on = saved.includes(Number(li.dataset.step))
    li.classList.toggle('done', on)
    li.setAttribute('aria-checked', String(on))
  })
  syncProg()
}

function saveDone(n) {
  const done = [...paneBody.querySelectorAll('.steps li.done')].map((li) => Number(li.dataset.step))
  try { localStorage.setItem(doneKey(n), JSON.stringify(done)) } catch (err) {}
  syncProg()
  syncTabs()
}

// 顶部阶段条同步总进度：某阶段全部勾完就标一个小勾，跨刷新保留
function syncTabs() {
  railItems.forEach((btn) => {
    const n = Number(btn.dataset.stage)
    const total = (STAGES[n - 1]?.steps || []).length
    let done = 0
    try { done = (JSON.parse(localStorage.getItem(doneKey(n)) || '[]')).length } catch (err) { done = 0 }
    btn.classList.toggle('done', total > 0 && done >= total)
  })
}

function selectStage(n, pushHash = true, scroll = true) {
  const s = STAGES[n - 1]
  if (!s) return
  current = n
  railItems.forEach((b) => {
    const on = Number(b.dataset.stage) === n
    b.classList.toggle('on', on)
    b.setAttribute('aria-selected', String(on))
  })
  pno.textContent = 'STAGE 0' + n
  ptitle.textContent = s.title
  pmeta.textContent = s.meta
  paneBody.innerHTML = stageMarkup(s)
  paneBody.scrollTop = 0
  restoreDone(n)
  syncTabs()
  currentPrompt = buildPrompt(s)

  // 逐段错峰入场，换阶段时内容是一层一层落下来的
  paneBody.querySelectorAll('.sec').forEach((sec, i) => {
    sec.classList.add('swap-in')
    sec.style.animationDelay = i * 40 + 'ms'
  })

  navCount.textContent = `0${n} / 08`
  prevStage.disabled = n === 1
  nextStage.disabled = n === 8
  if (pushHash) history.replaceState(null, '', '#stage-' + n)
  if (scroll && pane.getBoundingClientRect().top < -8) {
    pane.scrollIntoView({ behavior: 'smooth', block: 'start' })
  }
}

railItems.forEach((btn) => {
  btn.addEventListener('click', () => selectStage(Number(btn.dataset.stage)))
})

copyPrompt.addEventListener('click', () => copyText(currentPrompt, copyPrompt))
copyTpl.addEventListener('click', () => copyText(TEMPLATES[current] || '', copyTpl, '模板已复制'))

// 面板里的复制按钮、折叠与步骤勾选
paneBody.addEventListener('click', (e) => {
  const step = e.target.closest('.steps li')
  if (step && !e.target.closest('a')) {
    const on = step.classList.toggle('done')
    step.setAttribute('aria-checked', String(on))
    saveDone(current)
    return
  }
  const fold = e.target.closest('.detail-btn')
  if (fold) {
    const box = fold.closest('.detail')
    const open = box.classList.toggle('open')
    fold.setAttribute('aria-expanded', String(open))
    return
  }
  const btn = e.target.closest('.copy')
  if (!btn) return
  const row = btn.closest('.sk-row')
  const text = row ? row.querySelector('.v').innerText.trim() : ''
  copyText(text, btn)
})

paneBody.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' && e.key !== ' ') return
  const step = e.target.closest('.steps li')
  if (!step) return
  e.preventDefault()
  const on = step.classList.toggle('done')
  step.setAttribute('aria-checked', String(on))
  saveDone(current)
})

prevStage.addEventListener('click', () => { if (current > 1) selectStage(current - 1) })
nextStage.addEventListener('click', () => { if (current < 8) selectStage(current + 1) })

const fromHash = () => {
  const m = location.hash.match(/#stage-([1-8])/)
  selectStage(m ? Number(m[1]) : 1, false, false)
}
window.addEventListener('hashchange', fromHash)
fromHash()
