<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="Segoe UI, Microsoft YaHei, sans-serif">
<rect width="560" height="380" fill="#ffffff"/>
<text x="280" y="18" font-size="12" fill="#94a3b8" text-anchor="middle">正弦定理与余弦定理</text>
<line x1="300" y1="62" x2="96" y2="300" stroke="#334155" stroke-width="2.2"/>
<line x1="96" y1="300" x2="486" y2="300" stroke="#334155" stroke-width="2.2"/>
<line x1="486" y1="300" x2="300" y2="62" stroke="#334155" stroke-width="2.2"/>
<line x1="300" y1="62" x2="300" y2="300" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="5 4"/>
<circle cx="300" cy="62" r="4.5" fill="#2563eb"/>
<text x="286" y="52" font-size="13" font-weight="700" fill="#2563eb">A</text>
<circle cx="96" cy="300" r="4.5" fill="#2563eb"/>
<text x="78" y="318" font-size="13" font-weight="700" fill="#2563eb">B</text>
<circle cx="486" cy="300" r="4.5" fill="#2563eb"/>
<text x="494" y="318" font-size="13" font-weight="700" fill="#2563eb">C</text>
<text x="190" y="190" font-size="12.5" font-weight="600" fill="#16a34a" text-anchor="middle">c</text>
<text x="400" y="190" font-size="12.5" font-weight="600" fill="#16a34a" text-anchor="middle">b</text>
<text x="300" y="330" font-size="12.5" font-weight="600" fill="#16a34a" text-anchor="middle">a</text>
<text x="310" y="186" font-size="11" fill="#94a3b8">h</text>
<text x="300" y="350" font-size="11" fill="#334155" text-anchor="middle">a² = b² + c² − 2bc cos A</text>
<text x="300" y="368" font-size="10.5" fill="#94a3b8" text-anchor="middle">a / sin A = b / sin B = c / sin C = 2R</text>
</svg>